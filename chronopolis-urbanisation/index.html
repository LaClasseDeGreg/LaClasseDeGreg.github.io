<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chronopolis · L'urbanisation du monde · 4e</title>
<meta name="description" content="Parcours de révision gamifié sur l'urbanisation du monde, 4e. LaClasseDeGreg, Lycée français Victor Hugo de Sofia.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@500;700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1030; --night:#160a33; --night2:#2a1066; --pink:#ff2e88; --yellow:#ffd60a; --cyan:#00e5ff;
  --lime:#a3ff3b; --orange:#ff7a00; --violet:#7b2ff7; --ok:#16a34a; --ko:#e11d48; --paper:#fffaf0;
  --ch:#7b2ff7; --r:18px; --shadow:6px 6px 0 var(--ink);
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:17px;line-height:1.45;color:var(--ink);
  background:var(--night);
  background-image:radial-gradient(circle at 20% 10%,rgba(123,47,247,.55),transparent 45%),radial-gradient(circle at 85% 30%,rgba(255,46,136,.35),transparent 40%),radial-gradient(circle at 50% 100%,rgba(0,229,255,.25),transparent 50%),radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.3px);
  background-size:auto,auto,auto,18px 18px;background-attachment:fixed}
body.facile{--body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:20px;line-height:1.7;letter-spacing:.02em}
button{font:inherit;cursor:pointer;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 40px}
[hidden]{display:none!important}
/* Barre du haut */
.top{position:sticky;top:0;z-index:30;background:rgba(22,10,51,.92);backdrop-filter:blur(6px);border-bottom:3px solid var(--yellow)}
.top .in{max-width:1000px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#fff}
.logo{font-family:"Bangers",cursive;font-size:28px;letter-spacing:2px;color:var(--yellow);text-shadow:3px 3px 0 var(--pink);line-height:1}
.who{font-weight:800;font-size:14px;opacity:.9}
.energy{flex:1;min-width:150px;display:flex;align-items:center;gap:8px}
.ebar{flex:1;height:16px;background:#3b2a73;border:2px solid #fff;border-radius:999px;overflow:hidden;position:relative}
.ebar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime),var(--yellow));transition:width .8s cubic-bezier(.2,1.4,.4,1)}
.etxt{font-weight:900;font-size:13px;min-width:44px;text-align:right}
.tbtn{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-weight:800;font-size:13px;display:inline-flex;gap:6px;align-items:center;box-shadow:2px 2px 0 var(--pink)}
.tbtn[aria-pressed="true"]{background:var(--yellow)}
.tbtn svg{width:16px;height:16px}
/* Cartes BD */
.card{background:var(--paper);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:18px 0}
.h1{font-family:"Bangers",cursive;letter-spacing:1.5px;font-weight:400}
.btn{background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 20px;font-weight:900;font-size:17px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.y{background:var(--yellow);color:var(--ink)} .btn.c{background:var(--cyan);color:var(--ink)} .btn.w{background:#fff;color:var(--ink)} .btn.g{background:var(--ok)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{opacity:.75;font-size:14px}
/* Accueil */
.hero{text-align:center;color:#fff;padding:30px 0 6px}
.hero .t{font-family:"Bangers",cursive;font-size:clamp(54px,12vw,110px);line-height:.9;letter-spacing:4px;color:var(--yellow);text-shadow:5px 5px 0 var(--pink),10px 10px 0 var(--violet);animation:glitch 4s infinite}
.hero .s{font-weight:900;font-size:clamp(17px,3vw,22px);margin-top:12px}
.hero .s b{color:var(--cyan)}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translate(-3px,1px) skewX(-6deg)}95%{transform:translate(3px,-1px) skewX(5deg)}97%{transform:translate(-1px,0)}}
.trio{display:flex;justify-content:center;gap:4px;margin:6px 0 -6px}
.trio .ch{width:120px;animation:bob 3s ease-in-out infinite}
.trio .ch:nth-child(2){animation-delay:.5s}.trio .ch:nth-child(3){animation-delay:1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.step{font-family:"Bangers",cursive;font-size:24px;letter-spacing:1px;margin:0 0 8px;color:var(--violet)}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 16px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.pill[aria-pressed="true"]{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
select,input[type=text],input[type=password],textarea{font:inherit;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.guides{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.guides{grid-template-columns:1fr}}
.gcard{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px;text-align:left;box-shadow:4px 4px 0 var(--ink);display:flex;gap:10px;align-items:center}
.gcard .av{width:88px;flex:none;border-radius:12px;background:var(--yellow);border:3px solid var(--ink);overflow:hidden}
.gcard b{font-family:"Bangers",cursive;font-size:22px;letter-spacing:1px;font-weight:400;display:block}
.gcard span{font-size:14px;display:block}
.gcard[aria-pressed="true"]{background:#e9ffd0;outline:4px solid var(--lime)}
/* Scène */
.scene-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 10px;color:#fff}
.tag{background:var(--ch);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.stitle{font-family:"Bangers",cursive;font-size:clamp(30px,6vw,46px);letter-spacing:1.5px;line-height:1;text-shadow:3px 3px 0 var(--ink),5px 5px 0 var(--ch);margin:0;flex-basis:100%}
.pg{font-weight:900;font-size:13px;opacity:.85}
.photos{position:relative;border:4px solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#000}
.photos .grid{display:grid;grid-template-columns:1fr}
.photos .grid.two{grid-template-columns:1fr 1fr}
.photos img{width:100%;height:clamp(200px,42vw,380px);object-fit:cover}
.photos .grid.two img{height:clamp(170px,32vw,320px)}
.photos .grid.two img+img{border-left:4px solid var(--ink)}
.peek{position:absolute;bottom:-6px;left:10px;width:clamp(96px,18vw,150px);filter:drop-shadow(4px 4px 0 rgba(0,0,0,.5));animation:peek .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes peek{from{transform:translateY(110%)}to{transform:none}}
.onom{position:absolute;top:12px;right:12px;font-family:"Bangers",cursive;font-size:clamp(28px,5vw,44px);color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-8deg);animation:pop .5s .3s both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg)}}
.credit{font-size:12px;color:#ddd;margin:6px 4px 0}
.stage{border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);background:linear-gradient(160deg,#2a1066,#140733);padding:14px;display:flex;justify-content:center;align-items:flex-end;gap:6px;min-height:200px;position:relative;overflow:hidden}
.stage .ch{width:clamp(90px,20vw,160px);animation:bob 3s ease-in-out infinite}
.stage .ch:nth-child(2){animation-delay:.4s}.stage .ch:nth-child(3){animation-delay:.8s}
.stage .portal{width:clamp(120px,24vw,190px);align-self:center}
.spin{transform-origin:100px 100px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Dialogues */
.dlg{margin:16px 0}
.bub{display:flex;gap:10px;align-items:flex-start;margin:10px 0;opacity:0;transform:translateY(10px) scale(.98);transition:opacity .35s,transform .35s}
.bub.on{opacity:1;transform:none}
.bub .av{width:58px;height:64px;flex:none;border:3px solid var(--ink);border-radius:14px;background:var(--yellow);overflow:hidden}
.bub .av.portail{background:#2a1066}
.bub .tx{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:9px 13px;position:relative;box-shadow:3px 3px 0 var(--ink)}
.bub .tx:before{content:"";position:absolute;left:-12px;top:16px;border:9px solid transparent;border-right-color:var(--ink)}
.bub .tx:after{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:#fff}
.bub .nm{font-family:"Bangers",cursive;letter-spacing:1px;font-size:17px;color:var(--ch);display:block;line-height:1.1}
.bub.portail .tx{background:#e9fbff}
.dlg-tools{display:flex;gap:8px;justify-content:flex-end}
.small{font-size:13px;padding:6px 10px}
/* Défi */
.defi{position:relative}
.defi .badge{position:absolute;top:-18px;left:14px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:2px 12px;font-family:"Bangers",cursive;letter-spacing:1px;font-size:20px;transform:rotate(-3deg)}
.cons{font-weight:800;margin:6px 0 12px}
.qn{font-size:13px;font-weight:900;color:var(--ch);text-transform:uppercase;letter-spacing:.05em}
.q{font-weight:900;font-size:1.12em;margin:4px 0 12px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);background:#fff8d6}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;background:var(--cyan)}
.opt.good{background:#dcfce7;border-color:var(--ok)} .opt.good .L{background:var(--ok);color:#fff}
.opt.bad{background:#ffe4e6;border-color:var(--ko)} .opt.bad .L{background:var(--ko);color:#fff}
.opt[disabled]{cursor:default}
.fb{border:3px solid var(--ink);border-radius:14px;padding:10px 13px;margin-top:12px;animation:pop2 .35s both}
@keyframes pop2{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.fb.ok{background:#dcfce7} .fb.ko{background:#ffe4e6}
.fb b.k{font-family:"Bangers",cursive;letter-spacing:1px;font-size:20px;font-weight:400;display:block}
.fb p{margin:5px 0 0}
.vf{display:flex;gap:10px;margin-top:6px}
.vf .opt{flex:1;justify-content:center}
.next{margin-top:14px;display:flex;justify-content:flex-end}
.retiens{background:linear-gradient(135deg,#fff3b0,#ffe066);border:4px solid var(--ink);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);margin:16px 0;position:relative}
.retiens b{font-family:"Bangers",cursive;font-size:22px;letter-spacing:1px;font-weight:400;display:block}
.gain{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:900}
.gem{width:46px;height:46px;animation:gem 1.2s ease-out both}
@keyframes gem{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
/* Placement sur carte */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:7px 13px;font-weight:800;font-size:15px;box-shadow:2px 2px 0 var(--ink);touch-action:none}
.chip.sel{background:var(--yellow);transform:translateY(-2px) scale(1.04);box-shadow:3px 5px 0 var(--ink)}
.chip.used{opacity:.35}
.mapbox{position:relative;border:4px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#9fd7ff;box-shadow:var(--shadow)}
.mapbox svg{display:block;width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);box-shadow:0 0 0 0 rgba(255,46,136,.7);animation:pulse 1.6s infinite;padding:0}
.spot.filled{background:var(--cyan);animation:none}
.spot.good{background:var(--ok);animation:none} .spot.bad{background:var(--ko);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,46,136,.7)}70%{box-shadow:0 0 0 14px rgba(255,46,136,0)}100%{box-shadow:0 0 0 0 rgba(255,46,136,0)}}
.slab{position:absolute;transform:translate(-50%,0);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.slab.good{background:#dcfce7}
@media(max-width:600px){.spot{width:24px;height:24px;border-width:3px}.slab{font-size:10px;max-width:34vw;padding:1px 4px}}.slab.bad{background:#ffe4e6;text-decoration:line-through}
.here{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:11px;color:var(--ink);background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:1px 5px;white-space:nowrap}
.corr{margin-top:12px;display:grid;gap:8px}
.corr .it{border:3px solid var(--ink);border-radius:12px;padding:8px 11px;background:#fff}
.corr .it.good{background:#ecfdf3}.corr .it.bad{background:#fff1f2}
.corr .it b{display:block}
/* Tri */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bin{border:3px dashed var(--ink);border-radius:16px;padding:10px;min-height:120px;background:#fff}
.bin h4{margin:0 0 8px;font-family:"Bangers",cursive;letter-spacing:1px;font-size:20px;font-weight:400}
.bin.rich{background:#f0fff4}.bin.poor{background:#fff7ed}
.bin.target{outline:4px solid var(--yellow);cursor:pointer}
.card2{display:block;width:100%;text-align:left;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px 10px;margin:6px 0;font-weight:700;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.card2.sel{background:var(--yellow)}
.card2.good{background:#dcfce7}.card2.bad{background:#ffe4e6}
/* Ordre */
.ord .card2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--cyan);border:2px solid var(--ink);margin-right:8px;font-weight:900}
/* Texte à trous */
.filltext{line-height:2.3;font-size:1.05em}
.blank{border:3px dashed var(--ink);border-radius:10px;background:#fff;padding:1px 10px;font-weight:900;min-width:110px;display:inline-block;text-align:center;line-height:1.5}
.blank.sel{background:var(--yellow);border-style:solid}
.blank.filled{border-style:solid;background:#e0f7ff}
.blank.good{background:#dcfce7;border-color:var(--ok)}.blank.bad{background:#ffe4e6;border-color:var(--ko)}
.bank{position:sticky;bottom:0;background:var(--paper);padding:8px 0;border-top:3px solid var(--ink);margin-top:10px}
/* Schéma */
.schema{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:start}
@media(max-width:760px){.schema{grid-template-columns:1fr}}
.legend{display:grid;gap:7px}
.lrow{display:flex;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:5px 8px;text-align:left;width:100%;min-height:52px}
.lrow svg{width:46px;height:40px;flex:none}
.lrow .slot{flex:1;border:2px dashed #888;border-radius:8px;padding:5px 8px;font-weight:800;font-size:14px;min-height:30px}
.lrow.ex{background:#f1f5f9}.lrow.ex .slot{border-style:solid;color:#334}
.lrow.filled .slot{border-style:solid;background:#e0f7ff}
.lrow.good{background:#ecfdf3}.lrow.bad{background:#fff1f2}
/* Rédaction */
textarea{min-height:130px;resize:vertical}
.crit{display:grid;gap:7px;margin-top:10px}
.crit div{border:3px solid var(--ink);border-radius:12px;padding:7px 11px;background:#fff}
.crit .y{background:#dcfce7}.crit .n{background:#fff1f2}
.modele{background:#eef6ff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin-top:10px}
/* Vidéo */
.vid{position:relative;padding-top:56.25%;border:4px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#000;box-shadow:var(--shadow)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Effets */
#flash{position:fixed;inset:0;pointer-events:none;z-index:80;opacity:0;background:#fff}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#burst{position:fixed;left:50%;top:42%;z-index:81;pointer-events:none;transform:translate(-50%,-50%) scale(0)}
#burst.go{animation:burst .9s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1.1) rotate(4deg);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:79}
/* Bilan */
.big{font-family:"Bangers",cursive;font-size:clamp(46px,10vw,80px);letter-spacing:2px;line-height:1;color:var(--violet)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;font-weight:900;box-shadow:3px 3px 0 var(--ink);display:flex;gap:8px;align-items:center}
.bdg svg{width:28px;height:28px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.nbar{display:grid;grid-template-columns:minmax(150px,40%) 1fr 50px;gap:8px;align-items:center;margin:5px 0;font-size:14px;font-weight:700}
.nbar .tr{height:14px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.nbar .tr i{display:block;height:100%}
.errs .it{border-left:6px solid var(--ko);background:#fff;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:15px}
.arcade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.arc{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px;box-shadow:3px 3px 0 var(--ink);text-align:left;font-weight:700}
.arc b{display:block;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(10,4,30,.8);z-index:90;display:grid;place-items:center;padding:14px}
.modal .box{background:var(--paper);border:4px solid var(--ink);border-radius:var(--r);width:min(960px,100%);max-height:92vh;overflow:auto;padding:14px;box-shadow:var(--shadow)}
.modal iframe.la{width:100%;height:min(70vh,560px);border:3px solid var(--ink);border-radius:12px}
footer{color:#cfc6ff;text-align:center;font-size:13px;padding:24px 14px}
footer a,footer button.lk{color:#fff;background:none;border:0;text-decoration:underline;font-size:13px}
footer img{height:38px;margin:0 auto 8px;background:#fff;border-radius:8px;padding:3px}
/* Espace professeur */
.prof table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.prof th,.prof td{border-bottom:1px solid #ddd;padding:6px;text-align:left;vertical-align:top}
.prof th{background:var(--ink);color:#fff;position:sticky;top:0}
.prof .heat td.c{text-align:center;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;font-weight:800}
.tabs button[aria-pressed="true"]{background:var(--yellow)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px}
.kpi b{display:block;font-size:26px;color:var(--violet)}
.scroll{overflow:auto;max-height:65vh;border:3px solid var(--ink);border-radius:12px}
@media print{.top,footer,.noprint,#flash,#burst,#confetti{display:none!important} body{background:#fff} .card{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="flash"></div><div id="burst"></div><canvas id="confetti"></canvas>
<header class="top" id="topbar" hidden>
 <div class="in">

const OUT = 'stroke="#1a1030" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
function eyes(m, x1, x2, y, kohl){
  const k = kohl ? `<path d="M${x1-16},${y-1} L${x1-24},${y+3}" ${OUT} fill="none"/><path d="M${x2+16},${y-1} L${x2+24},${y+3}" ${OUT} fill="none"/>` : '';
  if (m==='joie') return k+`<path d="M${x1-11},${y+3} Q${x1},${y-10} ${x1+11},${y+3}" ${OUT} fill="none"/><path d="M${x2-11},${y+3} Q${x2},${y-10} ${x2+11},${y+3}" ${OUT} fill="none"/>`;
  const r = m==='choc' ? 13 : 10, pr = m==='choc' ? 4 : 5.5, dx = m==='doute' ? 4 : 0;
  return k+`<ellipse cx="${x1}" cy="${y}" rx="${r}" ry="${r+2}" fill="#fff" ${OUT}/><ellipse cx="${x2}" cy="${y}" rx="${r}" ry="${r+2}" fill="#fff" ${OUT}/>`+
   `<circle cx="${x1+dx}" cy="${y+1}" r="${pr}" fill="#1a1030"/><circle cx="${x2+dx}" cy="${y+1}" r="${pr}" fill="#1a1030"/>`+
   `<circle cx="${x1+dx+2}" cy="${y-2}" r="1.8" fill="#fff"/><circle cx="${x2+dx+2}" cy="${y-2}" r="1.8" fill="#fff"/>`;
}
function brows(m, x1, x2, y, col, thick){
  const w = thick||5;
  const st = `stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"`;
  if (m==='choc') return `<path d="M${x1-13},${y-10} Q${x1},${y-22} ${x1+12},${y-12}" ${st}/><path d="M${x2-12},${y-12} Q${x2},${y-22} ${x2+13},${y-10}" ${st}/>`;

  return `<path d="M${x1-13},${y-6} Q${x1},${y-13} ${x1+12},${y-7}" ${st}/><path d="M${x2-12},${y-7} Q${x2},${y-13} ${x2+13},${y-6}" ${st}/>`;
}
function mouth(m, x, y){
  if (m==='choc') return `<ellipse cx="${x}" cy="${y+4}" rx="9" ry="12" fill="#5a1530" ${OUT}/>`;
  if (m==='joie') return `<path d="M${x-18},${y-3} Q${x},${y+24} ${x+18},${y-3} Z" fill="#5a1530" ${OUT}/><path d="M${x-9},${y+9} Q${x},${y+3} ${x+9},${y+9} Q${x},${y+15} ${x-9},${y+9}" fill="#ff6f91"/>`;

}

   ]},
  retiens:"Nos cinq villes se trouvent sur quatre continents différents. Toutes sont des métropoles, de très grandes villes reliées au reste du monde."

   ["portail","normal","En 2026, c'est tout l'inverse. Regardez cette vidéo de révision, puis répondez au questionnaire du Chronoportail."],

  video:{id:"UG4XF1lZizo", titre:"Réviser ton cours de géo en 5 minutes, l'urbanisation du monde", chaine:"PeriScola", duree:"4 min 45"},
  ch1:{type:"qcm", items:[
    {id:"v1", notion:"urb", q:"Depuis quand plus d'un être humain sur deux vit-il en ville ?",
     o:["Depuis 1789","Depuis 1950","Depuis 2007","Ce sera seulement le cas en 2050"], a:2,
     w:["En 1789, les citadins étaient très minoritaires. Presque tout le monde vivait à la campagne.","En 1950, moins d'un humain sur trois vivait en ville.",null,"C'est déjà fait depuis 2007. En 2050, environ sept humains sur dix devraient vivre en ville."],
     x:"Depuis 2007, les citadins sont plus nombreux que les ruraux. C'est un basculement historique."},
    {id:"v2", notion:"urb", q:"Qu'appelle-t-on l'exode rural ?",

     w:["C'est le contraire. Dans l'exode rural, on quitte la campagne pour la ville.",null,"Les routes ne sont pas un départ de population. Exode veut dire départ massif.","Les récoltes n'ont rien à voir. Exode veut dire départ, rural veut dire campagne."],
     x:"Les ruraux partent vers les villes pour trouver un emploi, des écoles, des hôpitaux. C'est l'exode rural, l'un des deux moteurs de la croissance urbaine avec les naissances nombreuses."},
    {id:"v3", notion:"urb", q:"Où les villes grandissent-elles le plus vite aujourd'hui ?",
     o:["En Europe","En Afrique et en Asie","En Amérique du Nord","En Océanie"], a:1,
     w:["L'Europe est déjà très urbanisée depuis longtemps. Ses villes grandissent lentement.",null,"L'Amérique du Nord est déjà urbanisée à plus de 80 %. Ses villes grandissent lentement.","L'Océanie compte peu d'habitants et ses villes grandissent lentement."],
     x:"La croissance urbaine se joue surtout en Afrique et en Asie, où l'exode rural et les naissances nombreuses font gonfler les villes très vite."},
    {id:"v4", notion:"met", q:"Une métropole, c'est…",
     o:["n'importe quelle ville de plus de 2 000 habitants","une ville construite d'un seul coup en périphérie","une grande ville qui concentre habitants, activités, richesses et pouvoirs de décision","un quartier de bureaux et de gratte-ciel"], a:2,
     w:["2 000 habitants, c'est le seuil d'une simple ville en France. Une métropole est beaucoup plus grande et plus puissante.","Ça, c'est une ville nouvelle, comme Songjiang à Shanghai.",null,"Ça, c'est le quartier des affaires (CBD). Il n'est qu'une partie de la métropole."],
     x:"Une métropole concentre les habitants, les activités, les richesses et les pouvoirs de décision. Elle est reliée au reste du monde."}
  ]},
  retiens:"Depuis 2007, plus d'un humain sur deux vit en ville. Les villes grandissent surtout en Afrique et en Asie, grâce à l'exode rural et aux naissances nombreuses."
},
/* ---------------- SHANGHAI ---------------- */
{ id:"sh1", ch:"sh", title:"Où est passé mon rempart ?", photo:"yuyuan", photo2:"lujiazui",
  credit:"Jardin Yu et tour de Shanghai, photo Timothée Gidenne. Lujiazui, photo Freeman Zhou. Unsplash.",
  cast:[
   ["lin","choc","Mon rempart ! En 1553, on venait de bâtir une muraille autour de Shanghai pour se protéger des pirates. Où est-elle passée ?"],
   ["portail","normal","Elle a été démolie en 1912 et remplacée par un boulevard circulaire. Mais ta vieille ville est toujours là, avec le jardin Yu. C'est le centre historique."],
   ["lin","doute","Et cette aiguille géante derrière le jardin ? Elle sert à recoudre les nuages ?"],
   ["portail","normal","C'est la tour de Shanghai, 632 mètres, l'une des plus hautes du monde. Elle se dresse à Lujiazui, de l'autre côté du fleuve Huangpu, là où il n'y avait que des champs et des entrepôts il y a quarante ans."],
   ["lin","joie","Des tours entières rien que pour des bureaux ? Il faut combien de marchands pour remplir tout ça ?"]
  ],
  ch1:{type:"qcm", items:[
    {id:"s1", notion:"cbd", q:"Lujiazui, avec sa forêt de gratte-ciel, est…",
     o:["un bidonville","le quartier des affaires (CBD) de Shanghai","une ville nouvelle","le port de Shanghai"], a:1,
     w:["Un bidonville est un quartier d'habitat précaire fait de matériaux de récupération. Rien à voir avec ces tours de verre et d'acier.",null,"Une ville nouvelle est construite d'un coup en périphérie, surtout pour loger des habitants. Lujiazui est un quartier de bureaux au cœur de la métropole.","Le grand port de Shanghai se trouve à Yangshan, sur des îles au large. Lujiazui accueille des bureaux, des banques et des sièges d'entreprises."],
     x:"Lujiazui est le quartier des affaires, le CBD. On y trouve les sièges des grandes entreprises, les banques et la bourse."},
    {id:"s2", notion:"centre", q:"Pourquoi construit-on si haut au centre des métropoles ?",
     o:["Parce que la loi interdit les maisons basses","Pour se protéger des inondations","Parce que le terrain y est rare et très cher, alors on empile les bureaux","Parce que plus personne ne veut vivre en périphérie"], a:2,
     w:["Aucune loi n'interdit les maisons basses. D'ailleurs, la vieille ville juste à côté est faite de petits bâtiments.","Les tours ne protègent pas des inondations. Shanghai, bâtie à quelques mètres au-dessus de la mer, est même menacée par la montée des eaux.",null,"Au contraire, des millions de personnes vivent en périphérie. C'est là que la ville s'étale."],
     x:"Au centre, le sol est rare et cher. En construisant en hauteur, on loge beaucoup de bureaux sur peu de place. Les tours sont aussi une vitrine qui montre la puissance de la ville au monde entier."}
  ]},
  retiens:"Le centre d'une métropole est dense et vertical. Le quartier des affaires (CBD) concentre bureaux, banques et sièges d'entreprises. Le centre historique, plus ancien, est souvent protégé."
},
{ id:"sh2", ch:"sh", title:"La carte de Madame Lin", photo:null, scene:"mapsh",
  cast:[
   ["lin","normal","Je suis marchande. Sans carte, pas de commerce ! Aide-moi à comprendre comment ma ville est organisée aujourd'hui."],
   ["portail","normal","Place les cinq étiquettes sur la carte de la métropole de Shanghai. Le trait bleu est le fleuve Huangpu."]
  ],
  ch1:{type:"localmap", map:"sh", notion:"loc", consigne:"Touche une étiquette, puis le cercle où elle doit aller.",
   items:[
    {id:"m_sh1", label:"Vieille ville, centre historique", spot:"vieille", notion:"centre", why:"La vieille ville est au cœur de la métropole, sur la rive ouest du Huangpu, là où se dressait le rempart de 1553."},
    {id:"m_sh2", label:"Lujiazui, quartier des affaires", spot:"lujiazui", notion:"cbd", why:"Lujiazui fait face à la vieille ville, sur la rive est du Huangpu, dans le district de Pudong."},
    {id:"m_sh3", label:"Songjiang, ville nouvelle", spot:"songjiang", notion:"vn", why:"Songjiang est en périphérie, au sud-ouest, à une quarantaine de kilomètres du centre. Elle a été construite pour accueillir une partie de la croissance de la ville."},
    {id:"m_sh4", label:"Port de Yangshan", spot:"yangshan", notion:"mondi", why:"Le port de Yangshan est bâti sur des îles en pleine mer, au sud-est. Un pont de plus de 30 km le relie à la côte, car les plus gros navires ont besoin d'eaux profondes."},
    {id:"m_sh5", label:"Aéroport de Pudong", spot:"pudong_aero", notion:"mondi", why:"L'aéroport de Pudong est à l'est, au bord de la mer, à une trentaine de kilomètres du centre. Les aéroports ont besoin de beaucoup de place, on les construit en périphérie."}
   ]},
  retiens:"Shanghai est organisée comme toutes les métropoles. Au centre, la vieille ville et le quartier des affaires. En périphérie, des villes nouvelles. Aux portes de la ville, un port et un aéroport ouverts sur le monde."
},
{ id:"sh3", bonus:{id:"UxYVsGhhbeY",titre:"Shanghai, espace de la mondialisation et puissance maritime",chaine:"FANCHDUMENE",duree:"2 min 25"}, ch:"sh", title:"Yangshan, la porte du monde", photo:"port",
  credit:"Terminal à conteneurs, photo CHUTTERSNAP. Unsplash.",
  cast:[
   ["lin","choc","Des boîtes en fer empilées comme des briques de thé ! Il y en a des milliers !"],
   ["portail","normal","Ce sont des conteneurs. Shanghai est le premier port à conteneurs du monde. Ils partent vers l'Europe, l'Afrique et l'Amérique."],
   ["lin","joie","De mon temps, une jonque mettait des semaines pour descendre la côte. Avec vos bateaux géants, ma soie serait en Europe en un mois. Ça, c'est un progrès."],
   ["portail","normal","Et pour aller à l'aéroport de Pudong, le train Maglev flotte au-dessus des rails grâce à des aimants. Il avale les 30 km en huit minutes à 300 km/h, et il a même roulé à 431 km/h avant 2021."],
   ["lin","doute","Vous habitez au centième étage et vous mangez des fruits venus de l'autre bout du monde. Vous êtes riches ou vous êtes fous ?"]
  ],
  ch1:{type:"vf", items:[
    {id:"s3", notion:"mondi", s:"Le port de Yangshan et l'aéroport de Pudong relient Shanghai au reste du monde.", a:true, x:"Le port et l'aéroport sont les portes d'entrée de la mondialisation. Marchandises et voyageurs y arrivent du monde entier."},
    {id:"s4", notion:"mondi", s:"Shanghai est une ville isolée qui vit surtout de l'agriculture.", a:false, x:"C'est faux. Shanghai est l'une des villes les mieux reliées de la planète, avec le premier port à conteneurs du monde et un grand quartier des affaires."},
    {id:"s5", notion:"urb", s:"Shanghai est passée d'environ 4 millions d'habitants en 1950 à près de 29 millions aujourd'hui.", a:true, x:"C'est vrai. Sa population a été multipliée par sept en soixante-dix ans. C'est une mégapole."},
    {id:"s6", notion:"seg", s:"Pour moderniser la ville, les autorités ont rasé de vieux quartiers et repoussé une partie de leurs habitants vers la périphérie.", a:true, x:"C'est vrai. Les nouveaux logements du centre sont trop chers pour beaucoup de familles, qui doivent partir vers les périphéries. Les habitants se retrouvent séparés selon leurs revenus."}
  ]},
  retiens:"Le port de Yangshan et l'aéroport de Pudong montrent que Shanghai est très bien reliée à la mondialisation."
},
/* ---------------- LE CAIRE ---------------- */
{ id:"ca1", bonus:{id:"FaMxJvjVzQI",titre:"L'enfer des embouteillages au Caire",chaine:"AFP",duree:"1 min 50"}, ch:"ca", title:"Des chars sans chevaux devant les pyramides", photo:"caire_trafic",
  credit:"Les pyramides de Gizeh au-dessus de la circulation, photo kai muro. Unsplash.",
  cast:[
   ["senou","choc","Les pyramides de Khéops ! Elles étaient déjà vieilles de 1 300 ans à mon époque. Mais d'où sortent tous ces chars sans chevaux qui hurlent ?"],
   ["portail","normal","Tu es dans l'agglomération du Caire, plus de 25 millions d'habitants selon l'ONU. C'est une mégapole, et même la seule ville non asiatique parmi les dix plus grandes villes du monde."],
   ["senou","doute","Vingt-cinq millions ? Toute l'Égypte de Ramsès comptait à peine quelques millions d'âmes. Je vais manquer de papyrus."],
   ["portail","normal","Beaucoup sont venus des villages de la vallée du Nil pour trouver du travail. Et les familles y ont beaucoup d'enfants."],
   ["boduos","joie","Et ce long serpent qui roule sous la terre, c'est quoi ? Le métro ? Au moins lui, il n'est pas coincé dans les bouchons !"]
  ],
  ch1:{type:"vf", items:[
    {id:"c1", notion:"met", s:"Une mégapole est une ville de plus de 10 millions d'habitants.", a:true, x:"C'est la définition. Le monde en compte 33, dont Le Caire et Shanghai."},
    {id:"c2", notion:"urb", s:"Tous les habitants du Caire sont nés au Caire, personne n'est venu des campagnes.", a:false, x:"C'est faux. Des millions de ruraux sont venus s'installer au Caire pour trouver un emploi. C'est l'exode rural."},
    {id:"c3", notion:"urb", s:"Le Caire grandit grâce à l'exode rural et aux naissances nombreuses.", a:true, x:"C'est vrai. Ce sont les deux moteurs de la croissance urbaine dans les pays du Sud."},
    {id:"c4", notion:"met", s:"Une ville très peuplée est forcément la ville la plus puissante du monde.", a:false, x:"C'est faux. La taille ne fait pas la puissance. Le Caire est bien plus peuplé que Paris, mais Paris pèse davantage dans l'économie mondiale avec ses sièges d'entreprises et ses institutions."}
  ]},
  retiens:"Le Caire est une mégapole de plus de 25 millions d'habitants. Elle grandit grâce à l'exode rural et aux naissances nombreuses."
},
{ id:"ca2", bonus:{id:"m4dh2NTxVf4",titre:"Au Caire, la Cité des morts reprend vie",chaine:"AFP",duree:"1 min 48"}, ch:"ca", title:"Des vivants chez les morts", photo:"caire_dense",
  credit:"Le Caire et les pyramides dans la brume, photo waa towaw. Unsplash.",
  cast:[
   ["senou","choc","J'ai vu des familles vivre au milieu d'un cimetière ! Moi qui écris des prières pour les tombes des nobles, voilà des vivants qui habitent chez les morts."],
   ["portail","normal","C'est la Cité des morts. Faute de logements à bas prix, des familles s'y sont installées. Autour du Caire, une grande partie des habitants vit dans des quartiers informels, construits sans autorisation sur d'anciens champs."],
   ["senou","colere","Et pendant ce temps, d'autres arrosent des pelouses de golf en plein désert, derrière des murs, des caméras et des gardiens ?"],
   ["portail","normal","Ce sont des résidences fermées, les compounds, réservées aux plus riches. Les habitants ne vivent pas ensemble, ils sont séparés selon leurs revenus."]
  ],
  ch1:{type:"sort", notion:"seg", consigne:"Range chaque espace dans la bonne colonne. Touche une carte, puis la colonne.",
   bins:["Espaces des plus riches","Espaces des plus pauvres"],
   items:[
    {id:"t1", txt:"Un compound gardé, avec piscine et golf, en plein désert près du Caire", bin:0, why:"Murs, gardiens, golf et piscine dans le désert, c'est un quartier aisé fermé, réservé aux plus riches."},
    {id:"t2", txt:"Des immeubles de briques construits sans autorisation sur d'anciens champs", bin:1, why:"Construits sans autorisation, souvent sans plan ni égouts, ces quartiers informels accueillent les familles qui n'ont pas les moyens de se loger ailleurs."},
    {id:"t3", txt:"La Cité des morts, où des familles vivent dans un cimetière", bin:1, why:"Vivre dans un cimetière est un choix forcé, faute de logement. Ce sont des habitants très pauvres."},
    {id:"t4", txt:"Kibera, à Nairobi, des cabanes en tôle sans eau courante", bin:1, why:"Kibera est un bidonville, un quartier d'habitat précaire fait de matériaux de récupération, souvent privé d'eau et d'électricité."},
    {id:"t5", txt:"Une villa sur les collines de Los Angeles, avec portail et gardien", bin:0, why:"Une villa protégée par un portail et un gardien est un espace des plus riches, à l'écart du reste de la ville."},
    {id:"t6", txt:"Des appartements de luxe à Pudong, hors de prix pour la plupart des Shanghaïens", bin:0, why:"Ces logements neufs du centre sont réservés aux plus riches. Les autres sont repoussés vers la périphérie."}
   ]},
  ch2:{type:"qcm", items:[
    {id:"t7", notion:"seg", q:"La séparation des habitants dans des quartiers différents selon leurs revenus s'appelle…",
     o:["l'exode rural","la ségrégation spatiale","l'étalement urbain","la mondialisation"], a:1,
     w:["L'exode rural est le départ des habitants des campagnes vers les villes. Il ne dit pas où ils s'installent dans la ville.",null,"L'étalement urbain est l'extension de la ville sur la campagne. Il ne parle pas de la séparation entre riches et pauvres.","La mondialisation est la mise en relation des régions du monde par les échanges."],
     x:"Quand riches et pauvres vivent dans des quartiers séparés, on parle de ségrégation spatiale, ou ségrégation socio-spatiale."}
  ]},
  retiens:"Dans les métropoles, riches et pauvres vivent séparés. Quartiers aisés fermés d'un côté, quartiers informels et bidonvilles de l'autre. C'est la ségrégation spatiale."
},
{ id:"ca3", ch:"ca", title:"Ramsès aussi avait sa capitale neuve", photo:"caire_etal",
  credit:"Le Caire s'étend jusqu'aux pyramides, photo Michael Starkie. Unsplash.",
  cast:[
   ["portail","normal","Le gouvernement égyptien a fait sortir du désert une Nouvelle capitale administrative, à environ 45 km à l'est du Caire. Les ministères s'y installent et le président y a prêté serment en 2024."],
   ["senou","joie","Ha ! Mon pharaon Ramsès a fait pareil. Il a bâti une capitale toute neuve, Pi-Ramsès, dans le delta. Et avant lui, Akhenaton avait construit Amarna, abandonnée peu après sa mort."],
   ["senou","doute","Je note sur mon papyrus que la ville déborde sur les champs et sur le désert, jusqu'au pied des pyramides."],
   ["portail","normal","Bien vu, scribe. Quand la ville s'étend sur la campagne qui l'entoure, c'est l'étalement urbain."]
  ],
  ch1:{type:"qcm", items:[
    {id:"c5", notion:"vn", q:"Une ville nouvelle, c'est…",
     o:["un vieux quartier rénové au centre","une ville construite d'un seul coup, selon un plan, souvent en périphérie","un quartier de gratte-ciel de bureaux","un village peu à peu rattrapé par la ville"], a:1,
     w:["Rénover un vieux quartier, c'est transformer le centre historique. Une ville nouvelle sort de terre d'un coup.",null,"Un quartier de gratte-ciel de bureaux est un quartier des affaires (CBD), comme Lujiazui.","Un village rattrapé par la ville, c'est l'étalement urbain. Une ville nouvelle, elle, est planifiée et construite d'un seul coup."],
     x:"Une ville nouvelle est construite d'un seul coup, selon un plan, en périphérie d'une métropole. Exemples, la Nouvelle capitale administrative égyptienne, Songjiang à Shanghai, Marne-la-Vallée près de Paris."},
    {id:"c6", notion:"peri", q:"L'étalement urbain, c'est…",
     o:["l'extension de la ville sur les espaces ruraux qui l'entourent","la construction de tours dans le centre","le départ des citadins vers l'étranger","la disparition des bidonvilles"], a:0,
     w:[null,"Construire des tours au centre, c'est faire grandir la ville en hauteur, pas en largeur.","Partir à l'étranger, c'est émigrer. Cela n'agrandit pas la ville.","Les bidonvilles ne disparaissent pas. Ils se trouvent souvent justement en périphérie, là où la ville s'étale."],
     x:"L'étalement urbain est l'extension de la ville sur les champs, les forêts ou le désert qui l'entourent. Lotissements, quartiers informels, zones commerciales et villes nouvelles y poussent."}
  ]},
  retiens:"Une ville nouvelle est construite d'un seul coup, selon un plan, en périphérie. L'étalement urbain est l'extension de la ville sur l'espace rural."
},

const CONF = { parts:[], run:false };
function confetti(n){
  const c=$("#confetti"); c.width=innerWidth; c.height=innerHeight; const x=c.getContext("2d");
  const cols=["#ff2e88","#ffd60a","#00e5ff","#a3ff3b","#7b2ff7","#ff7a00"];
  for(let i=0;i<(n||90);i++) CONF.parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*7+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120});
  if(CONF.run) return; CONF.run=true;
  (function step(){ x.clearRect(0,0,c.width,c.height); CONF.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.a+=p.va;p.life--; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();}); CONF.parts=CONF.parts.filter(p=>p.life>0&&p.y<c.height+20); if(CONF.parts.length) requestAnimationFrame(step); else {CONF.run=false;x.clearRect(0,0,c.width,c.height);} })();

/* ---------- Plan de la partie ---------- */
function buildPlan(guide){
  const by = ch => PAGES.filter(p=>p.ch===ch);
  const blocs = { sh:by("sh"), ca:by("ca").concat(by("na")), pa:by("pa").concat(by("la")) };
  const ordre = [GUIDES[guide].ville].concat(["sh","ca","pa"].filter(v=>v!==GUIDES[guide].ville));
  return by("pro").concat(...ordre.map(v=>blocs[v]), by("syn")).map(p=>p.id);
}
function itemsOf(ch){
  if(!ch) return [];
  if(ch.type==="write") return [{id:ch.id,max:ch.max,notion:ch.notion}];
  if(ch.type==="fill"){ const ids=[...ch.text.matchAll(/\[\[([^\]]+)\]\]/g)].map((m,i)=>({id:"f"+i,max:1,notion:ch.notion})); return ids; }
  return ch.items.map(it=>({id:it.id,max:1,notion:it.notion||ch.notion}));
}
function pageItems(p){ return itemsOf(p.ch1).map(x=>({...x,id:(p.ch1.type==="fill"?p.id+"_":"")+x.id})).concat(itemsOf(p.ch2)); }

     ${pts===3||tries>=2?`<div class="modele"><b>Exemple de réponse attendue</b><br>${esc(typo(ch.modele))}</div>`:""}`;

    if(ch.type==="qcm") ch.items.forEach(it=>{ if(S.ans[it.id]&&!S.ans[it.id].pts) errs.push(`${it.q} <b>${it.o[it.a]}</b>`); });
    if(ch.type==="vf") ch.items.forEach(it=>{ if(S.ans[it.id]&&!S.ans[it.id].pts) errs.push(`${it.s} <b>${it.a?"Vrai":"Faux"}</b>`); });
    if(["localmap","worldmap","schema","sort"].includes(ch.type)) ch.items.forEach(it=>{ if(S.ans[it.id]&&!S.ans[it.id].pts) errs.push(`${it.label||it.txt}. ${it.why}`); });
  }));
  const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  const badges=[
    ["Cartographe","Toutes les étiquettes des cartes bien placées",["w_sh","w_ca","w_pa","w_na","w_la","m_sh1","m_sh2","m_sh3","m_sh4","m_sh5","m_pa1","m_pa2","m_pa3","m_pa4","m_pa5"].every(k=>S.ans[k]?.pts)],
    ["Urbaniste en chef","Schéma de synthèse sans faute",["g1","g2","g3","g4","g5","g6","g7","g8"].every(k=>S.ans[k]?.pts)],
    ["Scribe d'or","Paragraphe à 3 sur 3",(S.ans.r1?.pts||0)===3],
    ["Œil de lynx","Examen du Chronoportail à 8 sur 10 ou plus",["e1","e2","e3","e4","e5","e6","e7","e8","e9","e10"].filter(k=>S.ans[k]?.pts).length>=8],
    ["Voyageur du temps","Note de 15 sur 20 ou plus",n20>=15]
  ];
  const col=v=>v>=.75?"#16a34a":v>=.5?"#f59e0b":"#e11d48";
  $("#topbar").hidden=false; energy();
  go(`
   <div class="scene-head"><span class="tag">Mission accomplie</span><h1 class="stitle">Le Chronoportail est rechargé !</h1></div>
   <div class="stage">${["lin","senou","boduos"].map(k=>`<div class="ch">${CHARS[k]("joie")}</div>`).join("")}</div>
   <section class="dlg">${["lin","senou","boduos"].map(k=>`<div class="bub on"><div class="av">${CHARS[k]("joie")}</div><div class="tx"><span class="nm">${NAMES[k]}</span>${esc(typo(FINS[k]))}</div></div>`).join("")}</section>
   <section class="card" id="bilan">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
     <div><div class="muted">${esc(S.eleve)} · ${esc(S.classe)} · ${new Date().toLocaleDateString("fr-FR")}</div><div class="big">${String(n20).replace(".",",")} / 20</div><div><b>${sc} points sur ${MAXPTS}</b> en ${mins} minute${mins>1?"s":""}</div></div>
     <div class="row noprint"><a class="btn y" href="${COURS_URL}" target="_blank" rel="noopener" download>Télécharger mon cours</a><button class="btn w" id="print" type="button">Imprimer mon bilan</button></div>
    </div>
    <h3 class="h1" style="font-size:24px;margin:16px 0 6px">Mes badges</h3>
    <div class="badges">${badges.map(([n,d,ok])=>`<div class="bdg ${ok?"":"off"}" title="${esc(d)}"><svg viewBox="0 0 30 30"><polygon points="15,1 19,10 29,11 21,18 24,28 15,23 6,28 9,18 1,11 11,10" fill="${ok?"#ffd60a":"#ccc"}" stroke="#1a1030" stroke-width="2"/></svg>${esc(n)}</div>`).join("")}</div>
    <h3 class="h1" style="font-size:24px;margin:18px 0 6px">Mes notions</h3>
    ${Object.entries(byN).map(([k,b])=>{const v=b.p/b.m;return `<div class="nbar"><span>${esc(NOTIONS[k])}</span><div class="tr"><i style="width:${Math.round(v*100)}%;background:${col(v)}"></i></div><span>${Math.round(v*100)} %</span></div>`}).join("")}
    ${errs.length?`<h3 class="h1" style="font-size:24px;margin:18px 0 6px">Mes erreurs à retenir avant l'évaluation</h3><div class="errs">${errs.map(e=>`<div class="it">${typo(e)}</div>`).join("")}</div>`:`<p><b>Aucune erreur. Tu es prêt ou prête pour l'évaluation.</b></p>`}
    ${S.para?`<h3 class="h1" style="font-size:24px;margin:18px 0 6px">Mon paragraphe</h3><p>${esc(S.para)}</p>`:""}
   </section>
   <section class="card noprint">
    <h3 class="h1" style="font-size:28px;margin:0 0 6px">Salle d'arcade, pour aller plus loin</h3>
    <p class="muted">Facultatif. Des jeux et des vidéos pour réviser encore, à faire à la maison.</p>
    <div class="arcade">${BONUS.apps.map((a,i)=>`<button class="arc" type="button" data-app="${i}"><b>${esc(a.titre)}</b>${esc(a.type)}</button>`).join("")}${BONUS.videos.map((v,i)=>`<button class="arc" type="button" data-vid="${i}"><b>${esc(v.titre)}</b>Vidéo, ${esc(v.chaine)}, ${esc(v.duree)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn c" id="again" type="button">Rejouer avec un autre voyageur</button></div>
   </section>`);
  confetti(200); SFX.win(); flash("#a3ff3b");
  $("#print").onclick=()=>print();
  $("#again").onclick=()=>{ store.del(KEY); S=null; screenHome(); };
  app.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>{ const a=BONUS.apps[+b.dataset.app]; if(a.ext){ window.open(a.url,"_blank","noopener"); return; } modal(`<h3 class="h1" style="font-size:26px;margin:0 0 8px">${esc(a.titre)}</h3><iframe class="la" src="${a.embed}" allowfullscreen loading="lazy"></iframe><p class="muted">Si le jeu ne s'affiche pas, <a href="${a.url}" target="_blank" rel="noopener">ouvre-le dans un nouvel onglet</a>.</p>`); });
  app.querySelectorAll("[data-vid]").forEach(b=>b.onclick=()=>videoModal(BONUS.videos[+b.dataset.vid]));
}
function videoModal(v){ modal(`<h3 class="h1" style="font-size:26px;margin:0 0 8px">${esc(v.titre)}</h3><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><p class="muted">${esc(v.chaine)}, ${esc(v.duree)}. Facultatif. <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Ouvrir sur YouTube</a></p>`); }
function modal(html){ const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="box">${html}<div class="next"><button class="btn" type="button">Fermer</button></div></div>`; document.body.appendChild(m); m.querySelector(".next .btn").onclick=()=>m.remove(); m.onclick=e=>{if(e.target===m)m.remove();}; }

/* ---------- Espace professeur ---------- */
const PROF = {pw:null, rows:[], at:null, cls:"4A", tab:"eleves"};
function screenProf(){
  hush(); $("#topbar").hidden=true;
  go(`<section class="card prof"><h2 class="h1" style="font-size:34px;margin:0">Espace professeur</h2>
   <p class="muted">Résultats enregistrés dans la feuille Google du professeur. Le mot de passe est vérifié par le script, il n'est jamais écrit dans cette page.</p>
   <div class="row"><input type="password" id="pw" placeholder="Mot de passe" style="max-width:260px" autocomplete="off"><button class="btn" id="pgo" type="button">Ouvrir le tableau de bord</button><button class="btn w" id="pback" type="button">Retour au jeu</button></div><div id="perr"></div></section><div id="dash"></div>`);
  $("#pback").onclick=()=>screenHome();
  const open=async()=>{
    const pw=$("#pw").value.trim(); if(!pw) return;
    if(!SCRIPT_URL||SCRIPT_URL.indexOf("http")!==0){ $("#perr").innerHTML=`<div class="fb ko"><b class="k">Suivi pas encore relié</b><p>Le jeu n'est pas encore relié à la feuille Google de suivi. Il faut déployer le script, comme l'explique le LISEZ-MOI, puis coller son adresse dans la page.</p></div>`; return; }
    $("#perr").innerHTML=`<p class="muted">Chargement…</p>`;
    try{ const r=await fetch(SCRIPT_URL+"?pwd="+encodeURIComponent(pw)+"&t="+Date.now()); const d=await r.json();
      if(!d.ok){ $("#perr").innerHTML=`<div class="fb ko"><b class="k">Mot de passe incorrect</b></div>`; return; }
      PROF.pw=pw; PROF.rows=d.rows.filter(x=>!x.jeu||x.jeu===JEU); PROF.at=new Date(); $("#perr").innerHTML=""; dash();
    }catch(e){ $("#perr").innerHTML=`<div class="fb ko"><b class="k">Connexion impossible</b><p>Vérifie la connexion internet et l'adresse du script.</p></div>`; }
  };
  $("#pgo").onclick=open; $("#pw").onkeydown=e=>{if(e.key==="Enter")open();};
}
function bestRows(rows){
  const by={}; rows.forEach(r=>{ const k=r.classe+"|"+r.eleve; const cur=by[k]; const fin=String(r.termine)==="oui";
    const better=!cur || (fin && String(cur.termine)!=="oui") || (fin===(String(cur.termine)==="oui") && (+r.note20>+cur.note20 || (+r.note20===+cur.note20 && +r.page>+cur.page)));
    if(better) by[k]=r; }); return by;
}
function dash(){
  const rows=PROF.rows.filter(r=>r.classe===PROF.cls), best=bestRows(rows);
  const roster = PROF.cls==="Visiteur" ? [...new Set(rows.map(r=>r.eleve))] : ELEVES[PROF.cls];
  const parse=r=>{try{return JSON.parse(r.items||"{}")}catch(e){return{}}};
  const done=Object.values(best).filter(r=>String(r.termine)==="oui");
  const avg=done.length?(done.reduce((a,r)=>a+ +r.note20,0)/done.length):0;
  const qstat={}; Object.values(best).forEach(r=>{ const it=parse(r); Object.entries(it).forEach(([k,v])=>{ const q=qstat[k]=qstat[k]||{p:0,m:0,n:0}; q.p+=+v; q.m+=ALL[k]?ALL[k].max:1; q.n++; }); });
  const nstat={}; Object.entries(qstat).forEach(([k,q])=>{ const nk=ALL[k]?.notion; if(!nk) return; const s=nstat[nk]=nstat[nk]||{p:0,m:0}; s.p+=q.p; s.m+=q.m; });
  const label=k=>{ for(const p of PAGES){ for(const ch of [p.ch1,p.ch2].filter(Boolean)){ if(ch.type==="fill"&&k.startsWith(p.id+"_f")){ const i=+k.split("_f")[1]; return "Texte à trous Nairobi, mot "+(i+1); } if(ch.type==="write"&&ch.id===k) return "Paragraphe sur l'étalement urbain"; const it=(ch.items||[]).find(x=>x.id===k); if(it) return it.q||it.s||it.label||it.txt; } } return k; };
  const col=v=>v>=.75?"#dcfce7":v>=.5?"#fef3c7":"#ffe4e6";
  const fmt=d=>{try{return new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
  const notionsCols=Object.keys(NOTIONS);
  let body="";
  if(PROF.tab==="eleves") body=`<div class="scroll"><table><thead><tr><th>Élève</th><th>Avancée</th><th>Note /20</th><th>Temps</th><th>Dernière activité</th><th>Notions à revoir</th></tr></thead><tbody>${roster.map(n=>{ const r=best[PROF.cls+"|"+n]; if(!r) return `<tr><td>${esc(n)}</td><td colspan="5" class="muted">Pas encore joué</td></tr>`;
      const it=parse(r); const ns={}; Object.entries(it).forEach(([k,v])=>{const nk=ALL[k]?.notion; if(!nk)return; const s=ns[nk]=ns[nk]||{p:0,m:0}; s.p+=+v; s.m+=ALL[k].max;});
      const weak=Object.entries(ns).filter(([k,s])=>s.p/s.m<.5).map(([k])=>NOTIONS[k]);
      return `<tr><td><b>${esc(n)}</b><br><span class="muted">${esc(GUIDES[r.guide]?.nom||"")}</span></td><td>${String(r.termine)==="oui"?"Terminé":"Page "+r.page+" sur "+r.pages}</td><td><b>${String(r.note20).replace(".",",")}</b></td><td>${r.temps_min} min</td><td>${fmt(r.derniere_activite)}</td><td>${weak.length?esc(weak.join(", ")):"<span class='muted'>Aucune</span>"}</td></tr>`; }).join("")}</tbody></table></div>`;
  if(PROF.tab==="notions") body=`<p class="muted">Réussite de la classe par notion, sur la meilleure partie de chaque élève.</p>${notionsCols.filter(k=>nstat[k]).map(k=>{const v=nstat[k].p/nstat[k].m;return `<div class="nbar"><span>${esc(NOTIONS[k])}</span><div class="tr"><i style="width:${Math.round(v*100)}%;background:${v>=.75?"#16a34a":v>=.5?"#f59e0b":"#e11d48"}"></i></div><span>${Math.round(v*100)} %</span></div>`}).join("")||"<p>Pas encore de données.</p>"}
    <h3 class="h1" style="font-size:22px;margin:16px 0 6px">Carte de chaleur par élève</h3><div class="scroll"><table class="heat"><thead><tr><th>Élève</th>${notionsCols.map(k=>`<th style="font-size:11px">${esc(NOTIONS[k])}</th>`).join("")}</tr></thead><tbody>${roster.filter(n=>best[PROF.cls+"|"+n]).map(n=>{const it=parse(best[PROF.cls+"|"+n]); const ns={}; Object.entries(it).forEach(([k,v])=>{const nk=ALL[k]?.notion; if(!nk)return; const s=ns[nk]=ns[nk]||{p:0,m:0}; s.p+=+v; s.m+=ALL[k].max;}); return `<tr><td>${esc(n)}</td>${notionsCols.map(k=>ns[k]?`<td class="c" style="background:${col(ns[k].p/ns[k].m)}">${Math.round(ns[k].p/ns[k].m*100)}</td>`:`<td class="c muted">·</td>`).join("")}</tr>`}).join("")}</tbody></table></div>`;
  if(PROF.tab==="questions") body=`<p class="muted">Questions classées de la moins réussie à la mieux réussie. Idéal pour cibler la remédiation avant l'évaluation.</p><div class="scroll"><table><thead><tr><th>Question ou étiquette</th><th>Notion</th><th>Réussite</th><th>Élèves</th></tr></thead><tbody>${Object.entries(qstat).sort((a,b)=>a[1].p/a[1].m-b[1].p/b[1].m).map(([k,q])=>`<tr><td>${esc(label(k))}</td><td>${esc(NOTIONS[ALL[k]?.notion]||"")}</td><td style="background:${col(q.p/q.m)};font-weight:800">${Math.round(q.p/q.m*100)} %</td><td>${q.n}</td></tr>`).join("")}</tbody></table></div>`;
  if(PROF.tab==="paragraphes") body=`<div class="scroll" style="padding:8px;background:#fff">${Object.values(best).filter(r=>r.paragraphe).map(r=>`<div style="border-bottom:1px solid #ddd;padding:8px 0"><b>${esc(r.eleve)}</b> <span class="muted">${(parse(r).r1??"?")} sur 3</span><br>${esc(r.paragraphe)}</div>`).join("")||"<p>Aucun paragraphe pour l'instant.</p>"}</div>`;
  $("#dash").innerHTML=`<section class="card prof">
   <div class="tabs">${["4A","4C","Visiteur"].map(c=>`<button type="button" data-cls="${c}" aria-pressed="${PROF.cls===c}">${c==="Visiteur"?"Visiteurs":"4e "+c.slice(1)}</button>`).join("")}<button type="button" class="tbtn" id="refresh" style="margin-left:auto">Actualiser</button><button type="button" class="tbtn" id="csv">Exporter en CSV</button></div>
   <div class="kpis"><div class="kpi"><b>${Object.keys(best).length}</b>élèves ont commencé</div><div class="kpi"><b>${done.length}</b>ont terminé</div><div class="kpi"><b>${done.length?avg.toFixed(1).replace(".",","):"·"}</b>note moyenne /20</div><div class="kpi"><b>${PROF.cls==="Visiteur"?"·":roster.filter(n=>!best[PROF.cls+"|"+n]).length}</b>pas encore joué</div></div>
   <div class="tabs">${[["eleves","Élèves"],["notions","Notions"],["questions","Questions"],["paragraphes","Paragraphes"]].map(([k,l])=>`<button type="button" data-tab="${k}" aria-pressed="${PROF.tab===k}">${l}</button>`).join("")}</div>
   ${body}<p class="muted">Données chargées le ${PROF.at.toLocaleString("fr-FR")}. Pour chaque élève, la meilleure partie terminée est retenue.</p></section>`;
  $("#dash").querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{PROF.cls=b.dataset.cls;dash();});
  $("#dash").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{PROF.tab=b.dataset.tab;dash();});
  $("#refresh").onclick=async()=>{ try{const r=await fetch(SCRIPT_URL+"?pwd="+encodeURIComponent(PROF.pw)+"&t="+Date.now()); const d=await r.json(); if(d.ok){PROF.rows=d.rows.filter(x=>!x.jeu||x.jeu===JEU);PROF.at=new Date();dash();}}catch(e){} };
  $("#csv").onclick=()=>{ const keys=["classe","eleve","guide","termine","page","pages","score","max","note20","temps_min","premiere_activite","derniere_activite","paragraphe"]; const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const csv="﻿"+keys.join(";")+"\n"+PROF.rows.map(r=>keys.map(k=>q(r[k])).join(";")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="chronopolis_resultats.csv"; a.click(); };
}

/* ---------- Démarrage ---------- */
$("#bCours").onclick=()=>window.open(COURS_URL,"_blank","noopener");
$("#bSon").onclick=e=>{ SON=!SON; e.currentTarget.setAttribute("aria-pressed",SON); if(SON) SFX.ok(); };
$("#bFacile").onclick=e=>{ const on=!document.body.classList.contains("facile"); document.body.classList.toggle("facile",on); e.currentTarget.setAttribute("aria-pressed",on); store.set(KEY+"_facile",on); };
if(store.get(KEY+"_facile")){ document.body.classList.add("facile"); $("#bFacile").setAttribute("aria-pressed","true"); }
$("#bProf").onclick=()=>screenProf();
if(location.hash==="#prof") screenProf(); else screenHome();
</script>
</body>
</html>
