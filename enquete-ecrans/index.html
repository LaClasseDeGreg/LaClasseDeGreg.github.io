<style>
:root{

  --radius:14px;--shadow:0 1px 2px rgba(22,37,107,.06),0 8px 24px rgba(22,37,107,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",Calibri,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
a{color:var(--navy)}
.top{background:#fff;border-bottom:3px solid var(--red)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:38px;width:auto;display:block}
.top img.aefe{height:34px}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
@media (max-width:560px){.top .in{flex-wrap:wrap;row-gap:8px}.top img{height:30px}.top img.aefe{height:28px}.langs{order:3;width:100%}}
.langs{gap:10px}
.langs button{border:2px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:800;font-size:18px;padding:11px 20px;min-height:48px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.langs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
@keyframes langPulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.6)}70%{box-shadow:0 0 0 14px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
@keyframes langBlink{0%,100%{background:#fff;border-color:var(--navy)}50%{background:#fde8ec;border-color:var(--red)}}
.langs.attn button{animation:langPulse 1.3s ease-out infinite}
.langs.attn button[aria-pressed="false"]{animation:langPulse 1.3s ease-out infinite,langBlink 1.3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.langs.attn button{animation:none;border-color:var(--red)}}
@media (max-width:560px){.langs button{font-size:17px;padding:10px 0;flex:1;max-width:130px}}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero .in{max-width:760px;margin:0 auto;padding:26px 16px 30px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero h1{margin:6px 0 6px;font-size:clamp(28px,6vw,40px);line-height:1.1;font-weight:800}
.hero p{margin:0;opacity:.92;max-width:60ch}
main{max-width:760px;margin:-14px auto 0;padding:0 16px 48px;position:relative}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:22px;color:var(--navy)}
.card .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.fact{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.fact b{display:block;color:var(--navy);font-size:16px}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:560px){.who{grid-template-columns:1fr}}
.who button{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.who button:hover{border-color:var(--navy);transform:translateY(-1px)}
.who button b{display:block;color:var(--navy);font-size:19px}
.who button span{color:var(--muted);font-size:14px}
.note{font-size:13.5px;color:var(--muted);margin-top:14px}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.bar{height:8px;background:#dfe3ef;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#e2475f);transition:width .3s}
.step-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:5px}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .lab{font-weight:700;margin-bottom:4px;display:block}
.q .hint{font-size:14px;color:var(--muted);margin:0 0 8px}
.req{color:var(--red);margin-left:3px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:15.5px;line-height:1.3;transition:background .12s,border-color .12s}
.opt input:focus-visible+label{outline:3px solid #9fb0ff;outline-offset:2px}
.opt input:checked+label{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.grid th{font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 2px;text-align:center}
.grid td{padding:8px 2px;border-top:1px solid var(--line);text-align:center}
.grid td:first-child{text-align:left;padding-right:8px}
.grid input{width:20px;height:20px;accent-color:var(--navy)}
@media (max-width:620px){
  .grid thead{display:none}
  .grid,.grid tbody,.grid tr,.grid td{display:block;width:100%}
  .grid tr{border-top:1px solid var(--line);padding:10px 0}
  .grid td{border:0;padding:2px 0;text-align:left}
  .grid td.c{display:inline-block;width:auto;margin:4px 6px 0 0}
  .grid td.c label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
  .grid td.c .sr{position:static;width:auto;height:auto;clip:auto;overflow:visible;white-space:normal}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input.code{width:100%;max-width:320px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;letter-spacing:.04em}
input.code:focus{outline:3px solid #9fb0ff;border-color:var(--navy)}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus{outline:3px solid #9fb0ff;border-color:var(--navy)}
.err{display:none;color:var(--red);font-size:14px;font-weight:600;margin-top:6px}
.q.invalid .err{display:block}
.q.invalid .lab{color:var(--red)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:10px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 20px;border:0;cursor:pointer;font-size:16px}
.btn.primary{background:var(--red);color:#fff;margin-left:auto}
.btn.primary:hover{background:#a50d26}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:34px 20px}
.done .ok{width:64px;height:64px;border-radius:50%;background:#e6f4ec;color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:34px;font-weight:800}
.help{background:#fff6f7;border-left:4px solid var(--red);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-top:16px;text-align:left}
.test{background:#fff3cd;color:#664d03;text-align:center;font-size:13px;padding:6px}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px;text-align:center}
[hidden]{display:none!important}
</style>
</head>

const LI = {fr:0,bg:1,en:2};
let lang = "fr", profile = null, step = 0, sending = false;
const answers = {};
const qs = new URLSearchParams(location.search);
if (["fr","bg","en"].includes(qs.get("lang"))) lang = qs.get("lang");
else { const nl = (navigator.language||"fr").slice(0,2); if (nl==="bg") lang="bg"; else if (nl==="en") lang="en"; }

function tr(k){return T[lang][k]||T.fr[k]||"";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent = tr(el.dataset.t);});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  if (profile) renderStep();
  if (!ENDPOINT){ const tb=document.getElementById("testbar"); tb.hidden=false; tb.textContent="Mode test, les réponses ne sont pas encore enregistrées"; }
}

function renderStep(){
  const sec = S[profile][step], i = LI[lang], n = S[profile].length;
  document.getElementById("barfill").style.width = Math.round((step)/n*100)+"%";
  document.getElementById("steptitle").textContent = sec.title[i];
  document.getElementById("stepcount").textContent = tr("step")+" "+(step+1)+" "+tr("of")+" "+n;
  let h = '<section class="card"><h2>'+esc(sec.title[i])+'</h2>';
  sec.qs.forEach(q=>{
    const req = !q.opt;
    h += '<div class="q" data-q="'+q.id+'"><span class="lab" id="l_'+q.id+'">'+esc(q.l[i])+(req?'<span class="req" aria-hidden="true">*</span>':' <span class="hint">('+esc(tr("optional"))+')</span>')+'</span>';
    if (q.h) h += '<p class="hint">'+esc(q.h[i])+'</p>';
    if (q.t==="t"||q.t==="m"){
      const type = q.t==="t"?"radio":"checkbox";
      h += '<div class="opts" role="'+(q.t==="t"?"radiogroup":"group")+'" aria-labelledby="l_'+q.id+'">';
      O[q.o].forEach((o,k)=>{
        const cur = answers[q.id]; const on = q.t==="t" ? cur===k : (Array.isArray(cur)&&cur.includes(k));
        h += '<div class="opt"><input type="'+type+'" id="'+q.id+'_'+k+'" name="'+q.id+'" value="'+k+'"'+(on?' checked':'')+'><label for="'+q.id+'_'+k+'">'+esc(o[i])+'</label></div>';
      });
      h += '</div>';
    } else if (q.t==="g"){
      h += '<table class="grid"><thead><tr><th></th>'+O[q.o].map(o=>'<th>'+esc(o[i])+'</th>').join("")+'</tr></thead><tbody>';
      q.rows.forEach(r=>{
        h += '<tr><td>'+esc(r[i+1])+'</td>';
        O[q.o].forEach((o,k)=>{ const on = answers[r[0]]===k;
          h += '<td class="c"><label><input type="radio" name="'+r[0]+'" value="'+k+'"'+(on?' checked':'')+' aria-label="'+esc(r[i+1]+", "+o[i])+'"><span class="sr">'+esc(o[i])+'</span></label></td>'; });
        h += '</tr>';
      });
      h += '</tbody></table>';
    } else if (q.t==="c"){
      h += '<input type="text" class="code" name="'+q.id+'" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(answers[q.id]||"")+'" aria-labelledby="l_'+q.id+'">';
    } else if (q.t==="x"){
      h += '<textarea name="'+q.id+'" maxlength="600" aria-labelledby="l_'+q.id+'">'+esc(answers[q.id]||"")+'</textarea>';
    }
    h += '<div class="err" role="alert">'+esc(q.max?tr("max3"):tr("required"))+'</div></div>';
  });
  h += '</section>';
  document.getElementById("steps").innerHTML = h;
  document.getElementById("prev").style.visibility = "visible";
  const last = step===n-1;
  document.getElementById("next").textContent = last ? tr("send") : tr("next");
}

function collect(){
  const sec = S[profile][step];
  sec.qs.forEach(q=>{
    if (q.t==="t"){ const c=document.querySelector('input[name="'+q.id+'"]:checked'); answers[q.id] = c?Number(c.value):undefined; }
    else if (q.t==="m"){ answers[q.id] = [...document.querySelectorAll('input[name="'+q.id+'"]:checked')].map(c=>Number(c.value)); }
    else if (q.t==="g"){ q.rows.forEach(r=>{ const c=document.querySelector('input[name="'+r[0]+'"]:checked'); answers[r[0]] = c?Number(c.value):undefined; }); }
    else if (q.t==="x"){ answers[q.id] = document.querySelector('textarea[name="'+q.id+'"]').value.trim(); }
    else if (q.t==="c"){ answers[q.id] = document.querySelector('input[name="'+q.id+'"]').value.trim(); }
  });
}

function validate(){
  let ok = true, first = null;
  S[profile][step].qs.forEach(q=>{
    const box = document.querySelector('.q[data-q="'+q.id+'"]'); let bad = false;
    if (!q.opt){
      if (q.t==="t" && answers[q.id]===undefined) bad = true;
      if (q.t==="m" && !(answers[q.id]||[]).length) bad = true;
    }
    if (q.max && (answers[q.id]||[]).length>q.max) bad = true;
    box.classList.toggle("invalid", bad);
    if (bad){ ok=false; if(!first) first=box; }
  });
  if (first) first.scrollIntoView({behavior:"smooth",block:"center"});
  return ok;
}

function payload(){
  const out = {profil:profile, langue:lang, version:"2026-11-01b"};
  S[profile].forEach(sec=>sec.qs.forEach(q=>{
    const fr = k=>O[q.o][k][0];
    if (q.t==="t") out[q.id] = answers[q.id]===undefined ? "" : fr(answers[q.id]);
    else if (q.t==="m") out[q.id] = (answers[q.id]||[]).map(fr).join(" | ");
    else if (q.t==="g") q.rows.forEach(r=>{ out[r[0]] = answers[r[0]]===undefined ? "" : O[q.o][answers[r[0]]][0]; });
    else if (q.t==="x") out[q.id] = (answers[q.id]||"").slice(0,600);
    else if (q.t==="c") out[q.id] = (answers[q.id]||"").toLowerCase().replace(/\s+/g," ").slice(0,40);
  }));
  return out;
}

async function send(){
  if (sending) return; sending = true;
  const btn = document.getElementById("next"); btn.disabled = true; btn.textContent = tr("sending");
  const data = payload();
  if (document.querySelector('input[name="website"]').value) { finish(); return; }
  try {
    if (ENDPOINT) await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
    else console.log("Mode test", JSON.stringify(data));
    try { localStorage.setItem("ebd_envoye_"+profile, String(Date.now())); } catch(e){}
    finish();
  } catch(e){
    alert(tr("netErr")); btn.disabled=false; btn.textContent=tr("send"); sending=false;
  }
}

function finish(){
  document.getElementById("survey").hidden = true;
  document.getElementById("thanks").hidden = false;
  document.getElementById("barfill").style.width = "100%";
  document.getElementById("againWrap").hidden = profile!=="parent";
  document.getElementById("helpbox").hidden = profile!=="eleve";
  window.scrollTo({top:0,behavior:"smooth"});
}

function start(p){
  profile = p; step = 0; sending = false;
  for (const k in answers) delete answers[k];
  let prior = null; try { prior = localStorage.getItem("ebd_envoye_"+p); } catch(e){}
  if (prior && !confirm(tr("already"))) return;
  stopBlink();
  document.getElementById("welcome").hidden = true;
  document.getElementById("thanks").hidden = true;
  const f = document.getElementById("survey"); f.hidden = false;
  document.getElementById("next").disabled = false;
  renderStep(); window.scrollTo({top:0});
}

function stopBlink(){ document.getElementById("langs").classList.remove("attn"); }
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{ if (profile) collect(); lang=b.dataset.lang; applyLang(); stopBlink(); }));
document.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>start(b.dataset.profile)));
document.getElementById("next").addEventListener("click",()=>{
  collect(); if (!validate()) return;
  if (step < S[profile].length-1){ step++; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
  else send();
});
document.getElementById("prev").addEventListener("click",()=>{
  collect();
  if (step>0){ step--; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
  else { document.getElementById("survey").hidden = true; document.getElementById("welcome").hidden = false; profile = null; }
});
document.getElementById("steps").addEventListener("change",e=>{
  const box = e.target.closest(".q"); if (box) box.classList.remove("invalid");
});
document.getElementById("again").addEventListener("click",()=>{ try{localStorage.removeItem("ebd_envoye_parent");}catch(e){} start("parent"); });

applyLang();
if (qs.get("p")==="eleve"||qs.get("p")==="parent") start(qs.get("p"));
</script>
</body>
