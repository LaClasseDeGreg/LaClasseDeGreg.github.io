<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La cartographe disparue</title>
<meta name="description" content="Parcours de révision en escape game, la métropolisation, géographie 1re, Lycée français Victor Hugo de Sofia. LaClasseDeGreg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1030;--night2:#141a44;--ink:#e9ecff;--muted:#a9b0dc;--paper:#f7f0e1;--paper2:#efe4cc;--pink:#ff2bd6;--green:#39ff14;--blue:#00e5ff;--red:#C8102E;--navy:#16256B;--gold:#f5c542;--ok:#1f8a4c;--ko:#b3122e;
  --serif:"Fraunces",Georgia,serif;--hand:"Caveat","Segoe Print",cursive;--sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--ink);font:17px/1.55 var(--sans);
  background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);background-size:44px 44px;min-height:100vh}
body.easy{font-size:20px;line-height:1.8;letter-spacing:.02em;word-spacing:.08em}
body.easy .hand{font-family:var(--sans);font-size:1em}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 70px}
/* barre du haut */
#hud{position:sticky;top:0;z-index:20;background:rgba(11,16,48,.94);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.1)}
#hud .in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{display:flex;gap:4px}
.code span{width:30px;height:34px;border-radius:6px;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;font:800 18px var(--serif);color:transparent}
.code span.got{border:1.5px solid var(--gold);color:var(--gold);background:rgba(245,197,66,.12)}
.code span.tache{border-color:#c98a4a;color:#e0a46a}
.hudsp{flex:1}
.chip{border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.chip.cours{border-color:var(--blue);color:var(--blue);animation:glowB 1.6s ease-in-out infinite}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
/* écrans */
.hero{min-height:calc(100vh - 54px);display:grid;place-items:center;text-align:center;padding:30px 16px;
  background:linear-gradient(180deg,rgba(11,16,48,.35),rgba(11,16,48,.92)),url(img/hero.jpg) center/cover}
.hero h1{font:800 clamp(38px,8vw,72px)/1.02 var(--serif);margin:.2em 0;letter-spacing:-.01em}
.hero .kick{font:700 14px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.hero p.lede{max-width:620px;margin:10px auto 22px;color:#d6dbff;font-size:19px}
.cta{background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px 26px;font:700 18px var(--sans);box-shadow:0 0 0 0 rgba(200,16,46,.6);animation:pulseR 2.2s infinite}
.cta:disabled{opacity:.45;animation:none;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:10px 18px;margin:6px}
.btn{background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 18px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink)}
.sheet{background:var(--paper);color:#1d1b16;border-radius:14px;padding:22px 22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative}
.sheet h2{font:800 28px/1.15 var(--serif);margin:.1em 0 .4em;color:var(--navy)}
.sheet h3{font:700 19px var(--sans);color:var(--red);margin:1.2em 0 .4em}
.meta{font:700 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0}
.hand{font-family:var(--hand);font-size:1.45em;line-height:1.25;color:#2a2a63}
.note{background:var(--paper2);border-left:5px solid var(--navy);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.note.gold{border-color:#c99a06;background:#fff4cf}
.note.pink{border-color:var(--pink)}
.muted{color:var(--muted)}
.sheet .muted{color:#6c6658}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.photo{margin:14px -22px;position:relative}
.photo img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover}
.photo figcaption{font-size:12.5px;color:#6c6658;padding:6px 22px 0}
.notions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}
.notions div{background:#fff;border:1px solid #e3d8bd;border-radius:10px;padding:8px 10px;font-size:15px}
.notions b{color:var(--navy)}
/* liens fluo */
.lk{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border-radius:999px;padding:8px 14px;margin:4px 6px 4px 0;background:#111538;border:2px solid}
.lk.video{color:var(--pink);border-color:var(--pink);animation:glowP 1.4s ease-in-out infinite}
.lk.jeu{color:var(--green);border-color:var(--green);animation:glowG 1.4s ease-in-out infinite}
.lk.dl{color:var(--blue);border-color:var(--blue);animation:glowB 1.4s ease-in-out infinite}
.lk svg{width:18px;height:18px;flex:none}
@keyframes glowP{50%{box-shadow:0 0 18px 3px rgba(255,43,214,.75);filter:brightness(1.35)}}
@keyframes glowG{50%{box-shadow:0 0 18px 3px rgba(57,255,20,.7);filter:brightness(1.3)}}
@keyframes glowB{50%{box-shadow:0 0 18px 3px rgba(0,229,255,.7);filter:brightness(1.3)}}
@keyframes pulseR{70%{box-shadow:0 0 0 16px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition:none!important}.lk{box-shadow:0 0 12px 1px currentColor}}
/* rôles */
.gender{display:flex;gap:8px;margin:10px 0 14px}
.gender button{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px}
.gender button[aria-pressed="true"]{background:var(--gold);color:#221a00;border-color:var(--gold)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.role{display:flex;gap:12px;align-items:center;text-align:left;background:var(--night2);color:var(--ink);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:12px}
.role[aria-pressed="true"]{border-color:var(--gold);background:#1e2560}
.role .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.role .ic svg{width:28px;height:28px}
.role b{display:block;font-size:17px}
.role small{color:var(--muted);font-size:13.5px;line-height:1.35;display:block}
label.l{display:block;font-weight:700;margin:0 0 6px}
select.f,input.f{font:inherit;background:#fff;color:#111;border:2px solid #b9b2a0;border-radius:10px;padding:9px 12px;min-width:220px;max-width:100%}
.ident{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:18px}
/* étape */
.stagehead{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.bigletter{width:64px;height:72px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:800 40px var(--serif);flex:none;box-shadow:0 0 0 3px var(--gold) inset}
.stagehead h2{margin:0}
.counter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.counter div{background:var(--navy);color:#fff;border-radius:12px;padding:12px;text-align:center}
.counter b{display:block;font:800 30px var(--serif);color:var(--gold)}
.counter span{font-size:13.5px;color:#cfd5ff}
.rank{position:relative;height:calc(9 * 38px);margin:10px 0}
.rank .row{position:absolute;left:0;right:0;height:32px;display:flex;align-items:center;gap:10px;transition:transform .9s cubic-bezier(.6,.05,.3,1),opacity .5s}
.rank .row i{font-style:normal;width:30px;text-align:right;font-weight:700;color:var(--navy)}
.rank .row span{flex:1;background:#fff;border:1px solid #ddd2b8;border-radius:8px;padding:4px 10px;font-weight:700;display:flex;justify-content:space-between}
.rank .row.both span{border:2px solid var(--red);background:#ffe9ec}
.rank .row em{font-style:normal;font-weight:400;color:#6c6658;font-size:13.5px}
.tabs2{display:flex;gap:8px;flex-wrap:wrap}
.tabs2 button{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font-weight:700}
.tabs2 button[aria-pressed="true"]{background:var(--navy);color:#fff}
svg.map{width:100%;height:auto;background:#e8eef6;border-radius:12px;display:block}
.map .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 3.2s .3s forwards ease-in-out}
@keyframes draw{to{stroke-dashoffset:0}}
.map .city{cursor:pointer}.map .city:focus{outline:none}.map .city:focus-visible circle{stroke:var(--gold);stroke-width:4}
.map .city circle{transition:r .25s}
.map .city:hover circle,.map .city.on circle{stroke:var(--red);stroke-width:3}
.pulse{animation:pulseA 2s infinite}
@keyframes pulseA{50%{opacity:.35}}
.info{min-height:52px;background:#fff;border:1px solid #ddd2b8;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15.5px}
.frise{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.frise button{background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:10px;padding:8px 4px;font-weight:700;font-size:14px}
.frise button[aria-pressed="true"]{background:var(--navy);color:#fff}
.hot{position:relative}
.hot img{display:block;width:100%;border-radius:12px}
.hot button{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;background:var(--red);color:#fff;font-weight:800;font-size:14px;box-shadow:0 0 0 0 rgba(200,16,46,.7);animation:pulseR 1.8s infinite}
.hot button[aria-pressed="true"]{background:var(--navy)}
/* questions */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:5px}.dots i{width:12px;height:12px;border-radius:50%;background:#d8ccb0}.dots i.ok{background:var(--ok)}.dots i.ko{background:#d08a3c}.dots i.cur{outline:2px solid var(--navy)}
.q{font-weight:700;font-size:1.08em;margin:10px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:2px solid #d8ccb0;border-radius:12px;padding:11px 14px;color:#1d1b16}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.good{border-color:var(--ok);background:#e6f5ec}
.opt.bad{border-color:var(--ko);background:#fbe6ea}
.opt:disabled{cursor:default}
.trous{background:#fff;border-radius:12px;padding:14px;border:1px solid #e0d5bb;line-height:2.3}
.trous select{font:inherit;font-weight:700;border:2px solid var(--navy);border-radius:8px;padding:2px 6px;background:#f4f6ff;max-width:100%}
.trous select.good,.assoc select.good{border-color:var(--ok);background:#e6f5ec}
.trous select.bad,.assoc select.bad{border-color:var(--ko);background:#fbe6ea}
.assoc{display:grid;gap:8px}
.assoc div{display:grid;grid-template-columns:minmax(120px,1fr) minmax(150px,1.4fr);gap:8px;align-items:center;background:#fff;border:1px solid #e0d5bb;border-radius:10px;padding:8px 10px}
.assoc select{font:inherit;border:2px solid var(--navy);border-radius:8px;padding:6px;width:100%;background:#f4f6ff}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.ok{background:#e6f5ec;border:2px solid var(--ok)}
.fb.ko{background:#fff1e0;border:2px solid #d08a3c}
.fb b.t{display:block;margin-bottom:4px}
/* page gagnée */
.page{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,#d9cdb2 31px 32px);color:#1d1b16;border-radius:6px;padding:24px 24px 20px 60px;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.45);transform:rotate(-.6deg)}
.page:before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:#e48a8a}
.page.tache:after{content:"";position:absolute;right:30px;top:40px;width:120px;height:90px;border-radius:50% 40% 55% 45%;background:radial-gradient(circle at 40% 40%,rgba(140,90,40,.35),rgba(140,90,40,.12) 60%,transparent 70%)}
.stamp{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;border:5px solid var(--red);color:var(--red);font:800 52px var(--serif);transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.5,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.clue{background:#fff;border:2px dashed var(--navy);border-radius:10px;padding:10px 12px;margin:12px 0}
/* suspects */
.sus{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.su{background:#fff;border:2px solid #d8ccb0;border-radius:14px;padding:12px;text-align:left;color:#1d1b16}
.su[aria-pressed="true"]{border-color:var(--red);background:#fff0f2}
.su .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 18px var(--serif);margin-bottom:6px}
.su b{display:block}
.su small{display:block;color:#6c6658;line-height:1.35}
/* bilan */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.score div{background:var(--navy);color:#fff;border-radius:12px;padding:12px;text-align:center}
.score b{display:block;font:800 30px var(--serif);color:var(--gold)}
.errs li{margin:0 0 10px}
/* panneau cours */
dialog{border:0;border-radius:16px;padding:0;max-width:820px;width:calc(100% - 24px);background:var(--paper);color:#1d1b16}
dialog::backdrop{background:rgba(5,8,25,.75)}
dialog .in{padding:20px 22px;max-height:80vh;overflow:auto}
/* prof */
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #e3d8bd;vertical-align:top}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
footer.f{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px 40px}
footer.f button{background:none;border:0;color:var(--muted);text-decoration:underline}
@media (max-width:560px){.sheet{padding:18px 16px}.photo{margin:12px -16px}.photo figcaption{padding:6px 16px 0}.page{padding:20px 16px 18px 46px}.page:before{left:30px}.assoc div{grid-template-columns:1fr}.frise{grid-template-columns:repeat(2,1fr)}.bigletter{width:52px;height:58px;font-size:32px}.sheet h2{font-size:24px}}
</style>
</head>
<body>
<div id="hud"></div>
<main id="app"></main>
<footer class="f">LaClasseDeGreg · Grégory Cron · Lycée français Victor Hugo de Sofia · 2026-2027<br>
  <button type="button" id="credits">Crédits des images</button> · <button type="button" id="profBtn">Espace professeur</button></footer>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>

<script>
"use strict";
/* ============ Réglages ============ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzeHxF__BTVjSw260CTJjcOyEdMpPhejeOuHKWCEw8xbfGcR33Yobj6muOJFWY0JygE/exec";
const PREFIX = "M-"; // les parties de ce jeu sont rangées dans la même feuille que l'escape game Révolution, sous les classes M-1A, M-1B, M-Visiteurs
const STORE = "cartographe-disparue-v1";
const MUSIC = "../escape-revolution/musique/";
const COURS_PDF = "cours/Cours_1re_Geo_Metropolisation_LVH.pdf", COURS_DOCX = "cours/Cours_1re_Geo_Metropolisation_LVH.docx";
const ELEVES = {"1A": ["Karla A.", "Thibaud A.", "Alexandre B.", "Thomas C.", "Paul C.", "Pénélope D.", "Théo D.", "Ina D.", "Maraya G.", "Adrian H.", "Kristian K.", "Maria K.", "Paul K.", "Vivianne K.", "Alice L.", "Mia L.", "Elitza M.", "Boris P.", "Elsa S.", "Raya T.", "Pavel T.", "Eyango Y.", "Deyan Z."], "1B": ["Maxim B.", "Saúl B.", "Dalia D.", "Siana D.", "Aleksandar E.", "Toni G.", "Monica G.", "Ariimana I.", "Tamaterai I.", "Kaloyan J.", "Alexander K.", "Teya M.", "Dimana R.", "Daniel R.", "Ismael S.", "Philippe S.", "Daniel S.", "Noah S.", "Anna-Maria T.", "Kristina T.", "Damian Y."]};

/* ============ Icônes ============ */
const ICON = {
  video:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>',
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z" fill="currentColor"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>',
  city:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V9l5-3v15M10 21V3l9 4v14M13 9h3m-3 4h3m-3 4h3"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  bike:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-7h5l3 7M10 9 8 5h3"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg>'
};

/* ============ Personnages ============ */
const ROLES = [
  {id:"carto", ic:"compass", col:"#2f6fd6", f:["Mila, cartographe","Elle sait lire et dessiner une carte mieux que personne."], m:["Milan, cartographe","Il sait lire et dessiner une carte mieux que personne."], bonus:2},
  {id:"city",  ic:"chart",   col:"#7a1fa2", f:["Clara, analyste à la City","Elle connaît par cœur les classements des villes mondiales."], m:["Clément, analyste à la City","Il connaît par cœur les classements des villes mondiales."], bonus:1},
  {id:"urba",  ic:"city",    col:"#0b7a75", f:["Inès, urbaniste","Elle voit dans chaque quartier les choix qui l'ont fabriqué."], m:["Ilan, urbaniste","Il voit dans chaque quartier les choix qui l'ont fabriqué."], bonus:4},
  {id:"photo", ic:"camera",  col:"#b5470b", f:["Yana, photoreporter","Elle a couvert les favelas de Rio pour un magazine."], m:["Yanis, photoreporter","Il a couvert les favelas de Rio pour un magazine."], bonus:5},
  {id:"velo",  ic:"bike",    col:"#2f7d32", f:["Sacha, livreuse à vélo","Elle a pédalé dans toutes les rues de l'Est londonien."], m:["Sacha, livreur à vélo","Il a pédalé dans toutes les rues de l'Est londonien."], bonus:3},
  {id:"elu",   ic:"flag",    col:"#C8102E", f:["Daria, élue de Sofia","Elle siège au conseil municipal de la capitale."], m:["Dimitar, élu de Sofia","Il siège au conseil municipal de la capitale."], bonus:0}
];

/* ============ Suspects ============ */
const SUSPECTS = [
  {n:"Irena Koleva", c:"#16256B", d:"Adjointe au maire de Sofia chargée de l'attractivité. Elle rêve de faire entrer sa ville dans les classements mondiaux."},
  {n:"Viktor Draganov", c:"#6d4c41", d:"Promoteur immobilier, bureaux au Business Park de Mladost. Il construit des résidences de luxe sur les pentes de la Vitosha."},
  {n:"Leo Hartmann", c:"#455a64", d:"Consultant en ville intelligente, installé dans une tour de Canary Wharf, à Londres."},
  {n:"Nadia Petrova", c:"#ad1457", d:"Urbaniste, ancienne collègue d'Elena. Elle travaille depuis dix ans à São Paulo."}
];
const TRAITRE = 3;

/* ============ Les six pages du carnet ============ */

/* ============ Outils ============ */
const $ = s => document.querySelector(s);
const app = $("#app"), hud = $("#hud");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toTop = () => window.scrollTo({top:0, behavior:"instant"});
const TOTAL = STAGES.reduce((n, s) => n + s.qs.length, 0) + FINALE.length + 1;
let S = null;
function fresh(){ return {v:1, sid:"metro-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), step:"title", stage:0, q:0, phase:"lecture", role:null, g:"f", classe:"", eleve:"", ans:{}, errs:[], pages:[null,null,null,null,null,null], suspect:null, code:false, codeTries:0, start:0, elapsed:0, done:false}; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e){} }
function load(){ try { const d = JSON.parse(localStorage.getItem(STORE) || "null"); return d && d.v === 1 ? d : null; } catch(e){ return null; } }
let prefs = {}; try { prefs = JSON.parse(localStorage.getItem(STORE + "-prefs") || "{}"); } catch(e){}
const savePrefs = () => { try { localStorage.setItem(STORE + "-prefs", JSON.stringify(prefs)); } catch(e){} };
if (prefs.easy) document.body.classList.add("easy");
const role = () => ROLES.find(r => r.id === S.role);
const roleName = () => role() ? role()[S.g][0] : "";
function scoreOf(st){ const good = Object.values(st.ans).filter(a => a.ok).length; return {good, total:TOTAL, note:Math.round(good / TOTAL * 40) / 2}; }

/* ============ Musique ============ */
const audio = new Audio(); audio.loop = true; audio.volume = 0; let musicOn = !!prefs.music, curTrack = "";
function trackFor(){ if (!S || S.step === "title" || S.step === "prologue" || S.step === "choose") return "cinematique"; if (S.step === "bilan") return "marche-victoire"; if (S.step === "finale") return "emotion"; return S.stage % 2 ? "puissance" : "tension"; }
function music(){
  const t = trackFor();
  if (!musicOn){ audio.pause(); return; }
  if (t !== curTrack){ curTrack = t; audio.src = MUSIC + t + ".mp3"; audio.volume = 0; }
  audio.play().then(() => { let v = audio.volume; const it = setInterval(() => { v = Math.min(.35, v + .03); audio.volume = v; if (v >= .35) clearInterval(it); }, 120); }).catch(() => {});
}
function toggleMusic(){ musicOn = !musicOn; prefs.music = musicOn; savePrefs(); music(); drawHud(); }

/* ============ Lecture à voix haute ============ */
function speak(text){
  try {
    const sy = window.speechSynthesis; if (!sy) return;
    if (sy.speaking){ sy.cancel(); return; }
    const u = new SpeechSynthesisUtterance(text.replace(/\*\*/g, "")); u.lang = "fr-FR"; u.rate = .98;
    const v = sy.getVoices().find(x => /^fr/i.test(x.lang)); if (v) u.voice = v; sy.speak(u);
  } catch(e){}
}

/* ============ Horloge et barre du haut ============ */
let tick = null;
function startClock(){ clearInterval(tick); S.start = Date.now() - (S.elapsed || 0) * 1000; tick = setInterval(() => { if (!S || S.done) return; S.elapsed = Math.round((Date.now() - S.start) / 1000); const c = $("#clk"); if (c) c.textContent = fmtT(S.elapsed); }, 1000); }
const fmtT = s => Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0");
function drawHud(){
  const playing = S && !["title","prologue","choose","prof"].includes(S.step);
  hud.innerHTML = `<div class="in">
    ${playing ? `<div class="code" aria-label="Mot code">${STAGES.map((st, i) => `<span class="${S.pages[i] ? "got " + (S.pages[i] === "tache" ? "tache" : "") : ""}">${S.pages[i] ? st.id : ""}</span>`).join("")}</div>` : `<b style="font-family:var(--serif)">La cartographe disparue</b>`}
    <span class="hudsp"></span>
    ${playing ? `<span class="clock" id="clk">${fmtT(S.elapsed || 0)}</span>` : ""}
    <button class="chip cours" type="button" id="hCours">Le cours</button>
    <button class="chip" type="button" id="hEasy" aria-pressed="${!!prefs.easy}">Lecture facile</button>
    <button class="chip" type="button" id="hMus" aria-pressed="${musicOn}">Musique</button>
  </div>`;
  $("#hCours").onclick = openCours;
  $("#hEasy").onclick = () => { prefs.easy = !prefs.easy; savePrefs(); document.body.classList.toggle("easy", prefs.easy); drawHud(); };
  $("#hMus").onclick = toggleMusic;
}
function render(){
  drawHud();
  ({title, prologue, choose, stage:stageView, finale, bilan})[S.step]();
  music();
}

/* ============ Suivi professeur ============ */
function report(){
  if (!SCRIPT_URL || !S.eleve || !S.classe) return;
  const sc = scoreOf(S);
  const p = {session:S.sid, classe:PREFIX + (S.classe === "visit" ? "Visiteurs" : S.classe), eleve:S.eleve, temoin:roleName(),
    registres:S.pages.filter(Boolean).length, sceaux_intacts:S.pages.filter(x => x === "ok").length, bonnes:sc.good, repondues:Object.keys(S.ans).length,
    total:sc.total, pourcentage:Math.round(sc.good / sc.total * 100), note20:sc.note, temps_min:Math.round((S.elapsed || 0) / 6) / 10,
    erreurs:S.errs.length, termine:S.done ? "oui" : "non", fouche:S.suspect === null ? "" : (S.suspect === TRAITRE ? "oui" : "non")};
  try { fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", keepalive:true, headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p)}).catch(() => {}); } catch(e){}
}

function wireVis(kind){
  if (kind === "counters") document.querySelectorAll("[data-n]").forEach(b => { const n = +b.dataset.n, u = b.dataset.u, t0 = performance.now(), start = n > 1000 ? 1900 : 0;

  if (kind === "rank"){
    const set = k => { const rows = [...document.querySelectorAll("#rank .row")]; rows.sort((a, b) => +a.dataset[k] - +b.dataset[k]);
      rows.forEach((r, i) => { r.style.transform = `translateY(${i * 38}px)`; const v = +r.dataset[k]; r.querySelector("i").textContent = v > 50 ? "" : v; r.querySelector("em").textContent = v > 50 ? (k === "pop" ? "bien moins peuplée" : "peu ou pas classée") : (r.classList.contains("both") ? "dans les deux classements" : ""); r.style.opacity = v > 50 ? .55 : 1; });
      document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k)); };
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => set(b.dataset.k)); set("pop");
  }
  if (kind === "megalo" || kind === "bresil") document.querySelectorAll(".map .city").forEach(g => { const f = () => { document.querySelectorAll(".map .city").forEach(x => x.classList.remove("on")); g.classList.add("on"); $("#info").innerHTML = `<b>${esc(g.dataset.n)}</b>, ${esc(g.dataset.i)}`; }; g.onclick = f; g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") f(); }; });
  if (kind === "frise"){ const F = [...document.querySelectorAll("[data-f]")]; F.forEach(b => b.onclick = () => { F.forEach(x => x.setAttribute("aria-pressed", x === b)); $("#info").textContent = FRISE[+b.dataset.f]; }); }
  if (kind === "hot"){ const B = [...document.querySelectorAll("[data-h]")]; B.forEach(b => b.onclick = () => { B.forEach(x => x.setAttribute("aria-pressed", x === b)); $("#info").textContent = HOT[+b.dataset.h]; }); }
}

  const id = qid(); let html = `<p class="q">${md(q.q)}</p>`;
  if (q.t === "qcm"){ const order = shuffle(q.o.map((_, k) => k)); html += `<div class="opts">${order.map(k => `<button class="opt" type="button" data-k="${k}">${esc(q.o[k])}</button>`).join("")}</div>`; }
  if (q.t === "trous"){ let n = 0; const bank = shuffle(q.bank); html += `<div class="trous">${esc(q.txt).replace(/\[\[(.+?)\]\]/g, (m, w) => `<select data-a="${w}" aria-label="Mot manquant ${++n}"><option value="">……</option>${bank.map(b => `<option>${b}</option>`).join("")}</select>`)}</div><div class="act"><button class="btn" type="button" id="val">Valider</button></div>`; }
  if (q.t === "assoc"){
    const choix = q.choix || [...new Set(q.p.map(p => p[1]))];
    html += `<div class="assoc">${q.p.map((p, k) => `<div><span>${esc(p[0])}</span><select data-k="${k}" aria-label="${esc(p[0])}"><option value="">Choisis…</option>${(q.choix ? choix.map((c, j) => [j, c]) : shuffle(choix).map(c => [c, c])).map(([v, c]) => `<option value="${esc(v)}">${esc(c)}</option>`).join("")}</select></div>`).join("")}</div><div class="act"><button class="btn" type="button" id="val">Valider</button></div>`;
  }
  html += `<div id="fb" aria-live="polite"></div>`;
  holder.innerHTML = html;
  const finish = (ok, corr) => {
    S.ans[id] = {ok};
    if (!ok) S.errs.push({q:q.q, r:corr, ex:q.ex});
    $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "ko"}"><b class="t">${ok ? "Bonne réponse." : "Pas tout à fait. La page se tache un peu."}</b>${ok ? "" : `<p style="margin:4px 0"><b>La bonne réponse.</b> ${esc(corr)}</p>`}<p style="margin:4px 0">${esc(q.ex)}</p></div><div class="act"><button class="cta" type="button" id="nx">Continuer</button></div>`;
    save(); $("#nx").onclick = onDone; $("#nx").focus({preventScroll:true}); $("#fb").scrollIntoView({behavior:"smooth", block:"nearest"});
  };
  if (q.t === "qcm") holder.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k, ok = k === q.a;
    holder.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add("good"); }); if (!ok) b.classList.add("bad"); finish(ok, q.o[q.a]); });
  if (q.t === "trous") $("#val").onclick = () => { const sel = [...holder.querySelectorAll("select")]; if (sel.some(s => !s.value)) { $("#fb").innerHTML = `<p class="muted">Complète tous les trous avant de valider.</p>`; return; }
    let ok = true; sel.forEach(s => { const g = s.value === s.dataset.a; ok = ok && g; s.classList.add(g ? "good" : "bad"); s.disabled = true; }); $("#val").remove();
    finish(ok, q.txt.replace(/\[\[(.+?)\]\]/g, "$1")); };
  if (q.t === "assoc") $("#val").onclick = () => { const sel = [...holder.querySelectorAll("select")]; if (sel.some(s => s.value === "")) { $("#fb").innerHTML = `<p class="muted">Fais tous les choix avant de valider.</p>`; return; }
    let ok = true; sel.forEach(s => { const p = q.p[+s.dataset.k]; const g = String(s.value) === String(p[1]); ok = ok && g; s.classList.add(g ? "good" : "bad"); s.disabled = true; }); $("#val").remove();
    finish(ok, q.p.map(p => p[0] + ", " + (q.choix ? q.choix[p[1]] : p[1].trim())).join(". ")); };
}
function dots(prefix, n, cur){ return `<div class="dots">${Array.from({length:n}, (_, k) => { const a = S.ans[prefix + k]; return `<i class="${a ? (a.ok ? "ok" : "ko") : ""} ${k === cur ? "cur" : ""}"></i>`; }).join("")}</div>`; }
function defi(){
  const st = STAGES[S.stage], q = st.qs[S.q];
  app.innerHTML = `<div class="wrap"><article class="sheet"><div class="qhead"><p class="meta">Défi de la page ${st.id} · question ${S.q + 1} sur 3</p>${dots(S.stage + "-", 3, S.q)}</div><div id="qh"></div>
    <p style="margin-top:16px"><button class="btn alt" type="button" id="back" style="color:var(--navy);border-color:var(--navy);font-size:14px">Relire la page</button></p></article></div>`;
  $("#back").onclick = () => { S.phase = "lecture"; render(); toTop(); };
  renderQ(q, $("#qh"), () => {
    if (S.q < 2){ S.q++; save(); render(); toTop(); return; }
    const all = [0, 1, 2].every(k => S.ans[S.stage + "-" + k] && S.ans[S.stage + "-" + k].ok);
    S.pages[S.stage] = all ? "ok" : "tache"; S.phase = "page"; save(); report(); render(); toTop();
  });
}
function pageWon(){
  const i = S.stage, st = STAGES[i], ok = S.pages[i] === "ok";
  app.innerHTML = `<div class="wrap"><div class="page ${ok ? "" : "tache"}">
    <p class="meta" style="color:var(--navy)">Page ${i + 1} retrouvée · ${esc(st.lieu)}</p>
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:10px 0"><span class="stamp">${st.id}</span>
      <p style="margin:0;max-width:440px">${ok ? "Page intacte. Tu as répondu juste aux trois questions." : "Page tachée, mais lisible. Tes erreurs t'attendent dans ton carnet, à la fin."} La lettre <b>${st.id}</b> rejoint le mot code.</p></div>
    <div class="clue"><b>Indice sur la personne qui menace Elena</b><br><span class="hand" style="font-size:1.3em">${esc(st.clue)}</span></div>
    <p><b>Le saviez-vous ?</b> ${esc(st.fact)}</p>
    <div class="act"><button class="cta" type="button" id="nx">${i < 5 ? "Ville suivante, " + esc(STAGES[i + 1].lieu) : "Entrer dans la salle des cartes"}</button></div>
  </div></div>`;
  $("#nx").onclick = () => { if (i < 5){ S.stage++; S.phase = "lecture"; S.q = 0; } else { S.step = "finale"; S.fq = -1; } save(); render(); toTop(); };
}

/* ---------- salle des cartes ---------- */
function finale(){
  if (S.fq === -1){
    app.innerHTML = `<div class="wrap"><article class="sheet"><p class="meta">Retour à Sofia · la salle des cartes</p><h2>Une porte, un clavier, six lettres</h2>
      <p class="hand">La porte de la salle des cartes est verrouillée. Sur le clavier, une étiquette de la main d'Elena, « Le mot qui relie toutes les métropoles. »</p>
      <p>Tes six lettres, dans l'ordre des pages, sont <b style="letter-spacing:.3em">${STAGES.map(s => s.id).join(" ")}</b>.</p>
      <p><label class="l" for="code">Tape le mot code</label><input class="f" id="code" maxlength="12" autocomplete="off" autocapitalize="characters"></p><div id="cfb" aria-live="polite"></div>
      <div class="act"><button class="cta" type="button" id="ok">Ouvrir la porte</button></div></article></div>`;
    const go = () => { const v = $("#code").value.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().trim();
      if (v === "RESEAU" || S.codeTries >= 1){ S.code = v === "RESEAU"; S.fq = 0; save(); render(); toTop(); return; }
      S.codeTries++; $("#cfb").innerHTML = `<div class="fb ko">Ce n'est pas le bon mot. Les métropoles fonctionnent en… ? Un dernier essai, et la porte s'ouvrira de toute façon.</div>`; };
    $("#ok").onclick = go; $("#code").onkeydown = e => { if (e.key === "Enter") go(); }; $("#code").focus(); return;
  }
  if (S.fq < FINALE.length){
    app.innerHTML = `<div class="wrap"><article class="sheet"><div class="qhead"><p class="meta">Salle des cartes · épreuve ${S.fq + 1} sur 3</p>${dots("F", 3, S.fq)}</div>
      ${S.fq === 0 ? `<p class="hand" style="font-size:1.3em">« Ma carte est là, mais quelqu'un a mélangé la légende. Remets-la en ordre. »</p>` : `<p class="hand" style="font-size:1.3em">« Au dos de la carte, j'avais commencé un plan pour le bac. »</p>`}
      <div id="qh"></div></article></div>`;
    renderQ(FINALE[S.fq], $("#qh"), () => { S.fq++; save(); render(); toTop(); });
    return;
  }
  // le traître
  app.innerHTML = `<div class="wrap"><article class="sheet"><div class="qhead"><p class="meta">Salle des cartes · épreuve 3 sur 3</p>${dots("F", 3, 2)}</div>
    <h2>Qui menace Elena ?</h2>
    <p>Relis les six indices de ton carnet, puis désigne la personne qui veut vendre la carte à Skyline Holding.</p>
    <ol>${STAGES.map(s => `<li style="margin-bottom:6px">${esc(s.clue)}</li>`).join("")}</ol>
    <div class="sus">${SUSPECTS.map((p, k) => `<button class="su" type="button" data-s="${k}" aria-pressed="${S.suspect === k}"><span class="av" style="background:${p.c}">${p.n.split(" ").map(x => x[0]).join("")}</span><b>${esc(p.n)}</b><small>${esc(p.d)}</small></button>`).join("")}</div>
    <div id="fb" aria-live="polite"></div>
    <div class="act"><button class="cta" type="button" id="acc" disabled>Accuser</button></div></article></div>`;
  let pick = null;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { pick = +b.dataset.s; app.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#acc").disabled = false; });
  $("#acc").onclick = () => { if (pick === null) return; S.suspect = pick; const ok = pick === TRAITRE; S.ans["F2"] = {ok};
    if (!ok) S.errs.push({q:"Qui menace Elena ?", r:"Nadia Petrova", ex:"Elle ne vit pas à Sofia, Leo Hartmann n'a pas quitté Londres, elle vit à São Paulo en condominio fechado et a organisé la visite de Rocinha pour Skyline Holding."});
    S.done = true; S.step = "bilan"; save(); report(); render(); toTop(); };
}

function bilan(){
  const sc = scoreOf(S), intact = S.pages.filter(x => x === "ok").length, found = S.suspect === TRAITRE;
  clearInterval(tick);
  app.innerHTML = `<div class="wrap"><article class="sheet">
    <p class="meta">Fin de l'enquête</p><h2>${found ? "Démasquée, Nadia Petrova" : "La carte est sauvée, mais le coupable court toujours"}</h2>
    <p class="hand">${found ? "« Merci. Nadia voulait vendre ma carte des inégalités à Skyline Holding, pour savoir quels quartiers racheter avant que les prix ne flambent. Grâce à toi, elle sera exposée à la GeoNight, pour que tout le monde voie la ville telle qu'elle est. »" : "« Ce n'était pas la bonne personne. C'était Nadia Petrova, mon ancienne collègue. Elle ne vit pas à Sofia, elle habite un condominio fechado de São Paulo et a fait visiter Rocinha aux investisseurs de Skyline Holding. Ma carte est sauvée quand même, merci. »"}</p>
    <div class="score"><div><b>${String(sc.note).replace(".", ",")} / 20</b>ta note</div><div><b>${sc.good} sur ${sc.total}</b>bonnes réponses</div><div><b>${intact} sur 6</b>pages intactes</div><div><b>${fmtT(S.elapsed || 0)}</b>temps de jeu</div></div>
    <h3>Mon carnet d'erreurs</h3>
    ${S.errs.length ? `<p>Recopie ces corrections dans ton cahier, ce sont elles qui feront la différence le jour de l'évaluation.</p><ol class="errs">${S.errs.map(e => `<li><b>${esc(e.q)}</b><br>${esc(e.r)}<br><span class="muted">${esc(e.ex)}</span></li>`).join("")}</ol>` : `<p>Aucune erreur. Impressionnant. Relis quand même le cours, l'évaluation demandera de rédiger.</p>`}
    <h3>Le cours complet à télécharger</h3>
    <p><a class="lk dl" href="${COURS_PDF}" download>${ICON.dl} Le cours en PDF</a><a class="lk dl" href="${COURS_DOCX}" download>${ICON.dl} Le cours en Word</a><a class="lk dl" href="https://lls.fr/HG1P308" target="_blank" rel="noopener">${ICON.book} La leçon du manuel, pages 308 et 309</a></p>
    <div class="act"><button class="btn" type="button" id="again">Rejouer avec un autre personnage</button></div>
  </article></div>`;
  $("#again").onclick = () => { const k = {classe:S.classe, eleve:S.eleve, g:S.g}; S = fresh(); Object.assign(S, k); S.step = "choose"; save(); render(); toTop(); };
}

/* ============ Le cours en ligne ============ */
function openCours(){
  $("#dlgIn").innerHTML = `<p class="meta">Géographie 1re · Thème 1</p><h2 style="font:800 26px var(--serif);color:var(--navy);margin:.2em 0">La métropolisation, l'essentiel</h2>
    <p><a class="lk dl" href="${COURS_PDF}" download>${ICON.dl} Le cours complet en PDF</a><a class="lk dl" href="${COURS_DOCX}" download>${ICON.dl} Le cours complet en Word</a></p>
    ${STAGES.map(st => `<h3 style="color:var(--red)">${st.id} · ${esc(st.titre)}, ${esc(st.lieu)}</h3>${st.cours.map(p => `<p>${md(p)}</p>`).join("")}`).join("")}
    <div class="act"><button class="btn" type="button" id="close">Fermer</button></div>`;
  const d = $("#dlg"); $("#close").onclick = () => d.close(); d.showModal();
}

/* ============ Espace professeur ============ */
let PROF = null, profTab = "1A";
const fd = (v, y) => { const d = new Date(v), z = n => String(n).padStart(2, "0"); return z(d.getDate()) + "/" + z(d.getMonth() + 1) + (y ? "/" + d.getFullYear() : "") + " à " + d.getHours() + " h " + z(d.getMinutes()); };
function prof(){
  if (S && S.step !== "prof") S._prev = S.step;
  app.innerHTML = `<div class="wrap" style="max-width:1150px"><article class="sheet">
    <p class="meta">Espace professeur</p><h2>Suivi de La cartographe disparue</h2>
    ${PROF ? "" : `<p>Saisis le mot de passe de ton suivi (le même que pour l'escape game de la Révolution).</p>
    <p><input class="f" id="pwd" type="password" autocomplete="off" inputmode="numeric"> <button class="btn" id="login" type="button">Ouvrir</button></p><div id="perr"></div>`}
    <div id="dash"></div>
    <div class="act"><button class="btn alt" id="pback" type="button" style="color:var(--navy);border-color:var(--navy)">Revenir au jeu</button></div>
  </article></div>`;
  $("#pback").onclick = () => { if (S && S._prev){ S.step = S._prev; delete S._prev; render(); } else { S = S || fresh(); S.step = "title"; render(); } toTop(); };
  if (!PROF){
    const go = async () => { const pw = $("#pwd").value.trim(); if (!pw) return; $("#perr").innerHTML = `<p class="muted">Connexion…</p>`;
      try { const r = await fetch(SCRIPT_URL + "?pwd=" + encodeURIComponent(pw) + "&t=" + Date.now()); const d = await r.json();
        if (!d.ok){ $("#perr").innerHTML = `<div class="fb ko">Mot de passe incorrect.</div>`; return; }
        PROF = {pw, rows:(d.rows || []).filter(x => String(x.classe).indexOf(PREFIX) === 0), at:new Date()}; prof();
      } catch(e){ $("#perr").innerHTML = `<div class="fb ko">Impossible de joindre la feuille de suivi. Vérifie ta connexion.</div>`; } };
    $("#login").onclick = go; $("#pwd").onkeydown = e => { if (e.key === "Enter") go(); }; $("#pwd").focus(); return;
  }
  dash();
}
function lines(c){
  const rows = PROF.rows.filter(r => r.classe === PREFIX + c), by = {};
  rows.forEach(r => (by[r.eleve] = by[r.eleve] || []).push(r));
  const names = c === "Visiteurs" ? Object.keys(by).sort((a, b) => a.localeCompare(b, "fr")) : ELEVES[c];
  return names.map(n => { const a = (by[n] || []).sort((x, y) => String(y.derniere_activite).localeCompare(String(x.derniere_activite)));
    if (!a.length) return {n, st:0};
    const fin = a.filter(x => x.termine === "oui"), best = (fin.length ? fin : a).reduce((m, x) => +x.note20 > +m.note20 ? x : m);
    return {n, st:fin.length ? 2 : 1, last:a[0], best, tries:a.length, pages:Math.max(...a.map(x => +x.registres || 0))}; });
}
function dash(){
  const L = lines(profTab), done = L.filter(l => l.st === 2), started = L.filter(l => l.st >= 1);
  const avg = done.length ? done.reduce((s, l) => s + +l.best.note20, 0) / done.length : null;
  const n1 = v => String(Math.round(v * 10) / 10).replace(".", ",");
  const badge = s => s === 2 ? `<span class="tag" style="background:#1f8a4c;color:#fff">Terminé</span>` : s === 1 ? `<span class="tag" style="background:#f5c542;color:#2a1a00">En cours</span>` : `<span class="tag" style="background:#ddd;color:#555">Pas commencé</span>`;
  const bar = p => `<span style="display:inline-block;width:90px;height:10px;background:#e2d3ad;border-radius:5px;vertical-align:middle"><i style="display:block;height:100%;width:${Math.round(p / 6 * 100)}%;background:${p >= 6 ? "#1f8a4c" : "#c99a06"};border-radius:5px"></i></span> ${p} sur 6`;
  const tabs = Object.keys(ELEVES).concat("Visiteurs");
  $("#dash").innerHTML = `<div class="tabs2" role="tablist">${tabs.map(c => `<button type="button" data-t="${c}" aria-pressed="${c === profTab}">${c === "Visiteurs" ? "Visiteurs" : "Première " + c.slice(1)}</button>`).join("")}
      <button type="button" id="rf">Actualiser</button><button type="button" id="csv">Exporter en CSV</button></div>
    <div class="score"><div><b>${done.length} sur ${L.length}</b>${profTab === "Visiteurs" ? "visiteurs ont terminé" : "élèves ont terminé"}</div><div><b>${started.length - done.length}</b>en cours</div><div><b>${L.length - started.length}</b>pas encore commencé</div><div><b>${avg === null ? "…" : n1(avg) + " / 20"}</b>moyenne de ceux qui ont terminé</div></div>
    ${profTab !== "Visiteurs" && L.some(l => !l.st) ? `<div class="note"><b>Pas encore commencé</b>, ${L.filter(l => !l.st).map(l => esc(l.n)).join(", ")}</div>` : ""}
    <div style="overflow-x:auto"><table class="t"><thead><tr>${["Élève","Statut","Pages","Note","Pages intactes","Traître démasqué","Parties","Temps","Dernière activité"].map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${L.map(l => `<tr><td><b>${esc(l.n)}</b></td><td>${badge(l.st)}</td><td style="white-space:nowrap">${l.st ? bar(l.pages) : ""}</td>
      <td style="font-weight:700;color:${l.st && +l.best.note20 < 10 ? "#b3122e" : "#1f8a4c"}">${l.st ? n1(+l.best.note20) + " / 20" : ""}</td><td>${l.st ? l.best.sceaux_intacts + " sur 6" : ""}</td>
      <td>${l.st ? (l.best.fouche === "oui" ? "oui" : l.best.fouche === "non" ? "non" : "") : ""}</td><td>${l.st ? l.tries : ""}</td><td>${l.st ? n1(+l.best.temps_min) + " min" : ""}</td>
      <td style="white-space:nowrap">${l.st ? fd(l.last.derniere_activite) : ""}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="font-size:13.5px">Note retenue, la meilleure des parties terminées, sur ${TOTAL} questions ramenées sur 20. Données du ${fd(PROF.at, true)}.</p>`;
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { profTab = b.dataset.t; dash(); });
  $("#rf").onclick = async () => { try { const r = await fetch(SCRIPT_URL + "?pwd=" + encodeURIComponent(PROF.pw) + "&t=" + Date.now()); const d = await r.json(); if (d.ok){ PROF.rows = d.rows.filter(x => String(x.classe).indexOf(PREFIX) === 0); PROF.at = new Date(); dash(); } } catch(e){} };
  $("#csv").onclick = () => { const out = [["Classe","Élève","Statut","Pages","Note sur 20","Pages intactes","Traître démasqué","Parties","Temps (min)"].join(";")];
    tabs.forEach(c => lines(c).forEach(l => out.push([c, l.n, ["Pas commencé","En cours","Terminé"][l.st], l.st ? l.pages : "", l.st ? String(l.best.note20).replace(".", ",") : "", l.st ? l.best.sceaux_intacts : "", l.st ? l.best.fouche : "", l.st ? l.tries : 0, l.st ? String(l.best.temps_min).replace(".", ",") : ""].join(";"))));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + out.join("\n")], {type:"text/csv"})); a.download = "suivi_cartographe_disparue.csv"; document.body.appendChild(a); a.click(); a.remove(); };
}

/* ============ Démarrage ============ */
$("#profBtn").onclick = () => { if (!S) S = fresh(); prof(); drawHud(); toTop(); };
$("#credits").onclick = () => { $("#dlgIn").innerHTML = `<h2 style="font:800 24px var(--serif);color:var(--navy)">Crédits</h2><ul>
  <li>Les lumières des villes, NASA Goddard, Black Marble 2012, domaine public.</li><li>Sofia et la Vitosha, podoboq, CC BY 2.0.</li><li>Lower Manhattan from Brooklyn, King of Hearts, CC BY-SA 3.0.</li>
  <li>City of London skyline, Colin et Kim Hansen, CC BY-SA 4.0.</li><li>Canary Wharf from Greenwich Park, Sludge G, CC BY-SA 4.0.</li><li>Avenida Paulista, ProtoplasmaKid, CC BY-SA 4.0.</li><li>Rocinha favela closeup, Chensiyuan, CC BY-SA 4.0.</li></ul>
  <p>Toutes les photographies proviennent de Wikimedia Commons. Musiques issues de Pixabay. Personnages et histoire inventés pour LaClasseDeGreg, toute ressemblance serait fortuite.</p><div class="act"><button class="btn" type="button" id="close">Fermer</button></div>`;
  $("#close").onclick = () => $("#dlg").close(); $("#dlg").showModal(); };
S = fresh(); render();
</script>
</body>
</html>
